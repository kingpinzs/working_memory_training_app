# Project Context
user_description: |
  A web-based/PWA cognitive training platform to improve and track working memory capacity 
  with scientifically-backed assessments and data-driven proof of improvement.
  
  Personal mission: Demonstrate measurable working memory improvement through consistent 
  training and data tracking.
  
  Key capabilities:
  - Assessment tools to establish baseline working memory capacity
  - Scientific cognitive training exercises (N-Back, Span, Spatial binding, etc.)
  - Progress tracking with charts and data export
  - Adaptive training (Coach Mode) that adjusts difficulty based on performance
  - Gamification to maintain engagement (Mind Arcade)
  - PWA capabilities for offline use and app-like experience

