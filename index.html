<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0f1522" />
<meta name="description" content="Train your brain with scientifically-backed working memory exercises" />
<title>Working Memory Lab</title>
<link rel="manifest" href="/manifest.json" />
<style>
  :root{
    --bg:#0b0f14; --card:#121822; --ink:#e8f0ff; --muted:#9db0cc;
    --brand:#6ad3ff; --accent:#7cf6a4; --warn:#ffcc66; --err:#ff768b;
    --ok:#63f5b4; --line:#243043; --btn:#1c2432; --btn-hi:#233045; --focus:#3a66ff;
  }
  *{box-sizing:border-box}
  body{margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,Noto Sans; color:var(--ink);
    background:linear-gradient(180deg,#0a0e13 0%, #0b1220 100%) fixed;}
  header{position:sticky; top:0; z-index:5; background:rgba(11,15,20,.8); backdrop-filter: blur(10px); border-bottom:1px solid var(--line);}
  .wrap{max-width:1100px; margin:0 auto; padding:16px;}
  .flex{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  h1{font-size:20px; margin:0}
  .pill{display:inline-flex; align-items:center; padding:10px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--btn); color:var(--ink); cursor:pointer; user-select:none}
  .pill[aria-selected="true"]{background:var(--btn-hi); border-color:#3a4a66}
  main{padding:16px}
  .grid{display:grid; gap:16px}
  @media (min-width:980px){ .grid{grid-template-columns:1.2fr .8fr} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 10px 20px rgba(0,0,0,.25)}
  h2{margin:0 0 12px 0; font-size:16px}
  .muted{color:var(--muted)}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  button,.btn{background:var(--btn); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer}
  button:hover,.btn:hover{background:var(--btn-hi)}
  button.primary{background:linear-gradient(180deg,#1e2a42,#26405e); border-color:#3b5377}
  .kbd{font-family:ui-monospace,Menlo,Consolas,monospace; background:#0d1420; border:1px solid #1f2a3d; padding:2px 6px; border-radius:6px}
  .stack{display:flex; flex-direction:column; gap:10px}
  .center{display:flex; align-items:center; justify-content:center}
  .big{font-size:22px}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}
  .split{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .tag{display:inline-block; padding:4px 8px; border:1px solid var(--line); border-radius:999px; color:var(--muted)}
  .scoreline{display:flex; justify-content:space-between; border-bottom:1px dashed #22304a; padding:6px 0}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .caps{letter-spacing:.04em; text-transform:uppercase; font-weight:600; color:#b6c9e8}
  .sep{height:1px; background:var(--line); margin:8px 0}
  .note{padding:10px; background:#0f1522; border:1px solid #1f2c45; border-radius:10px}
  /* Triangle board */
  .pyramid{width:240px; height:210px; position:relative; margin:8px auto;}
  .tri{position:absolute; width:0; height:0; border-left:60px solid transparent; border-right:60px solid transparent; border-bottom:100px solid #1c2b44; filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)); cursor:pointer; opacity:.85}
  .tri:hover{filter:brightness(1.2)}
  .tri[data-pos="top"]{left:60px; top:0}
  .tri[data-pos="left"]{left:0; top:90px}
  .tri[data-pos="right"]{left:120px; top:90px}
  .tri.mark{border-bottom-color:#3b6df0}
  .tri.correct{border-bottom-color:#2bb673}
  .tri.wrong{border-bottom-color:#c24}
  .letterBubble{margin:8px auto; width:46px; height:46px; border-radius:50%; background:#1a2336; border:1px solid #2a3b5e; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700}
  .photoBox{height:110px; display:flex; align-items:center; justify-content:center; border:1px solid #23324a; border-radius:10px; background:#0f1725; font-weight:700; letter-spacing:.5px}
  .wordBank{display:flex; gap:8px; flex-wrap:wrap}
  .chip{padding:8px 10px; border:1px solid #31435f; background:#142034; border-radius:8px; cursor:pointer; user-select:none}
  .chip.good{outline:2px solid #35bf88} .chip.bad{outline:2px solid #d0657a}
  .timer{font-variant-numeric:tabular-nums}
  .hidden{display:none !important}
  .tight{margin:-4px 0 -2px}
  .switch{display:inline-flex; align-items:center; gap:8px}
  .switch input{appearance:none; width:40px; height:22px; border-radius:999px; background:#2a3954; position:relative; outline:none; cursor:pointer; border:1px solid #31435f}
  .switch input:checked{background:#2f6a4f}
  .switch input::after{content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#dfe9ff; border-radius:50%; transition:transform .2s}
  .switch input:checked::after{transform:translateX(18px)}
  canvas{width:100%; height:180px; background:#0f1725; border:1px solid #23324a; border-radius:10px}
  .shape{width:80px; height:80px; margin:10px; border-radius:10px; cursor:pointer}
  /* Streak calendar */
  .streak-calendar{display:flex; flex-wrap:wrap; gap:3px; margin-top:12px; max-width:600px}
  .calendar-day{transition:transform .2s}
  .calendar-day:hover{transform:scale(1.2)}
  .domain-card{transition:all .2s}
  .domain-card:hover{transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,0,0,.35); border-color:#3a4a66}
</style>
</head>
<body onload="initializeApp()">
<header>
  <div class="wrap flex">
    <h1>Working Memory Lab</h1>
            <nav class="flex" role="tablist" aria-label="Modes">
      <div class="pill" role="tab" aria-selected="true" data-tab="launchpad">Launchpad</div>
      <div class="pill" role="tab" aria-selected="false" data-tab="dashboard">Dashboard</div>

      <div class="pill" role="tab" aria-selected="false" data-tab="lifestyle">Lifestyle</div>
      <div class="pill" role="tab" aria-selected="false" data-tab="braintok">BrainTok</div>
    </nav>
    <div class="muted" style="margin-left:auto">All data stays local • No tracking</div>
  </div>
</header>

<main class="wrap grid">
  <section id="stage" class="card stack">
    <div id="screen"></div>
  </section>

  <aside class="stack">
    <div class="card stack">
      <h2 class="caps">Launchpad</h2>
      <div class="row" title="Adaptive difficulty across tasks">
        <label class="switch">
          <input id="coachToggle" type="checkbox" aria-label="Toggle Coach Mode for adaptive sessions">
        </label>
        <div><b>Coach Mode</b> <span class="muted">adaptive session</span></div>
      </div>
      <div class="sep"></div>
      <div class="stack">
        <div class="caps tight">Assessments</div>
        <div class="split" role="group" aria-label="Assessment tasks">
          <button class="primary" data-run="span" aria-label="Start WM Span reverse order task">WM Span (reverse)</button>
          <button class="primary" data-run="spatial" aria-label="Start Spatial and Verbal Binding task">Spatial+Verbal Bind</button>
          <button data-run="crossmodal" aria-label="Start Cross-modal Binding task">Cross-modal Binding</button>
          <button data-run="nback" aria-label="Start N-Back emotion task">1-Back / 2-Back (emotion)</button>
        </div>
        <div class="caps tight">Drills</div>
        <div class="split" role="group" aria-label="Cognitive drills">
          <button data-run="filterPos" aria-label="Start Filter the Positive task">Filter the Positive</button>
          <button data-run="mult" aria-label="Start Mental Multiplication task">Mental Multiplication</button>
        </div>
        <div class="caps tight">Programs</div>
        <div class="split" role="group" aria-label="Training programs">
          <button id="coachSession" aria-label="Start Coach Session program">Run Coach Session</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="caps">Scoreboard</h2>
      <div id="scores" class="stack" role="region" aria-label="Recent scores and achievements"></div>
      <div class="sep"></div>
      <div class="row">
        <button id="exportCsv" aria-label="Export scores as CSV file">Export CSV</button>
        <button id="resetScores" aria-label="Reset all scores - this action cannot be undone">Reset scores</button>
      </div>
    </div>
  </aside>
</main>

<script>
/* ---------- Infra & persistence ---------- */
const $ = s => document.querySelector(s);
const screen = $('#screen');

function Store(key, isArray = false) {
  this.key = key;
  this.isArray = isArray;
}
Store.prototype.get = function() {
  try {
    const defaultValue = this.isArray ? '[]' : '{}';
    const storedValue = localStorage.getItem(this.key);
    if (this.key === 'wmLabProfile' && storedValue === 'null') return null;
    return JSON.parse(storedValue || defaultValue);
  } catch (err) {
    console.warn(`[Store] Failed to parse ${this.key}:`, err);
    this.handleCorruptedData();
    return this.isArray ? [] : {};
  }
};
Store.prototype.set = function(data) {
  try {
    const serialized = JSON.stringify(data);
    localStorage.setItem(this.key, serialized);
  } catch (err) {
    if (err.name === 'QuotaExceededError') {
      this.handleQuotaExceeded();
    } else {
      console.error(`[Store] Failed to save ${this.key}:`, err);
      toast('⚠️ Failed to save data. Please try again.', 'warn');
    }
  }
};
Store.prototype.handleQuotaExceeded = function() {
  toast('⚠️ Storage quota exceeded. Cleaning old data...', 'warn');
  const data = this.get();
  if (this.isArray) {
    // Keep only last 100 entries for array stores
    const trimmed = data.slice(0, 100);
    try {
      localStorage.setItem(this.key, JSON.stringify(trimmed));
      toast('✅ Storage optimized. Oldest entries removed.');
    } catch {
      toast('❌ Unable to free storage. Please export and reset data.', 'err');
    }
  } else {
    // For object stores, trim each array to last 50 entries
    const trimmed = {};
    for (const [key, val] of Object.entries(data)) {
      trimmed[key] = Array.isArray(val) ? val.slice(-50) : val;
    }
    try {
      localStorage.setItem(this.key, JSON.stringify(trimmed));
      toast('✅ Storage optimized. Oldest entries removed.');
    } catch {
      toast('❌ Unable to free storage. Please export and reset data.', 'err');
    }
  }
};
Store.prototype.handleCorruptedData = function() {
  const backup = localStorage.getItem(this.key);
  if (backup) {
    const backupKey = `${this.key}_backup_${Date.now()}`;
    try {
      localStorage.setItem(backupKey, backup);
      console.info(`[Store] Corrupted data backed up to ${backupKey}`);
    } catch {
      console.warn('[Store] Could not backup corrupted data');
    }
  }
  localStorage.removeItem(this.key);
  toast('⚠️ Data corruption detected. Reset to defaults.', 'warn');
};
// Generic push method for array-based stores
Store.prototype.push = function(entry) {
  if (!this.isArray) {
    console.warn(`[Store] Push called on non-array store ${this.key}`);
    return;
  }
  const data = this.get();
  data.push(entry);
  this.set(data);
};

const store = new Store('wmLab');
const profileStore = new Store('wmLabProfile');
const focusStore = new Store('wmLabFocus', true); // true for array-based history
const lifestyleStore = new Store('wmLabLifestyle');
const realWorldStore = new Store('wmLabRealWorld', true); // Real-world wins log

// Special-casing for main score store to match original object structure
store.push = function(key, entry) {
  const s = this.get();
  s[key] = s[key] || [];
  s[key].push({ ...entry, type: key, ts: entry.ts ?? new Date().toISOString() });
  this.set(s);
  if (document.querySelector('#scores')) renderScores();
  // Update personal best displays on launchpad
  if (typeof updateLaunchpadPBs === 'function') updateLaunchpadPBs();
};
store.reset = function() {
  localStorage.removeItem(this.key);
  if (document.querySelector('#scores')) renderScores();
  drawLaunchpad();
  toast('Scores have been reset.');
};

// Personal best tracking helpers
function getPersonalBest(taskKey, metric = 'bestLevel') {
  const s = store.get();
  const records = s[taskKey] || [];
  if (records.length === 0) return null;

  // Different tasks have different "best" metrics
  switch (taskKey) {
    case 'span':
      return Math.max(...records.map(r => r.bestLevel || 0));
    case 'spatial':
    case 'crossmodal':
      return Math.max(...records.map(r => r.cleared || 0));
    case 'nback':
      // Best is highest acc2 if available, otherwise acc1
      const acc2s = records.filter(r => r.acc2 !== undefined).map(r => r.acc2);
      const acc1s = records.filter(r => r.acc1 !== undefined).map(r => r.acc1);
      if (acc2s.length > 0) return { acc2: Math.max(...acc2s) };
      if (acc1s.length > 0) return { acc1: Math.max(...acc1s) };
      return null;
    case 'filterPos':
      // Best is highest accuracy with lowest time
      const bestAcc = Math.max(...records.map(r => r.acc || 0));
      const bestTime = Math.min(...records.filter(r => r.acc === bestAcc).map(r => r.time || Infinity));
      return { acc: bestAcc, time: bestTime };
    case 'mult':
      return Math.max(...records.map(r => r.acc || 0));
    default:
      return null;
  }
}

function isPersonalBest(taskKey, newValue) {
  const best = getPersonalBest(taskKey);
  if (best === null) return true; // First entry is always a personal best

  switch (taskKey) {
    case 'span':
      return newValue > best;
    case 'spatial':
    case 'crossmodal':
      return newValue > best;
    case 'nback':
      // Check if new acc1 or acc2 beats the previous best
      if (typeof newValue === 'object') {
        if (newValue.acc2 !== undefined && best.acc2 !== undefined) {
          return newValue.acc2 > best.acc2;
        }
        if (newValue.acc1 !== undefined && best.acc1 !== undefined) {
          return newValue.acc1 > best.acc1;
        }
      }
      return false;
    case 'filterPos':
      // Better accuracy, or same accuracy with faster time
      if (newValue.acc > best.acc) return true;
      if (newValue.acc === best.acc && newValue.time < best.time) return true;
      return false;
    case 'mult':
      return newValue > best;
    default:
      return false;
  }
}

// Show inline reset confirmation instead of browser confirm()
function showResetConfirm() {
  const btn = document.getElementById('resetScores');
  if (!btn) return;

  // Create confirm/cancel container
  const parent = btn.parentElement;
  const confirmContainer = document.createElement('div');
  confirmContainer.id = 'resetConfirm';
  confirmContainer.className = 'row';
  confirmContainer.style.gap = '8px';

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'warn';
  confirmBtn.textContent = 'Confirm Reset';
  confirmBtn.onclick = () => {
    store.reset();
    cancelResetConfirm();
  };

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = cancelResetConfirm;

  confirmContainer.appendChild(confirmBtn);
  confirmContainer.appendChild(cancelBtn);

  btn.style.display = 'none';
  parent.appendChild(confirmContainer);
}

function cancelResetConfirm() {
  const container = document.getElementById('resetConfirm');
  const btn = document.getElementById('resetScores');
  if (container) container.remove();
  if (btn) btn.style.display = '';
}

// Expose key objects/functions for testing
window.store = store;
window.coachOn = undefined; // Will be defined later

// Generic push for array-based stores
focusStore.push = function(entry) {
    const data = this.get();
    data.unshift(entry); // Add to the beginning
    this.set(data);
};

realWorldStore.push = function(entry) {
    const data = this.get();
    data.unshift({ ...entry, ts: new Date().toISOString() }); // Add timestamp
    this.set(data);
};

const prefs = {
  get(){ try{ return JSON.parse(localStorage.getItem('wmLabPrefs')||'{}'); }catch{ return {}; } },
  set(p){ localStorage.setItem('wmLabPrefs', JSON.stringify(p)); }
};

$('#resetScores').onclick = showResetConfirm;
$('#exportCsv').onclick = exportCsv;

/* ---------- Tabs ---------- */
document.querySelectorAll('[role="tab"]').forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll('[role="tab"]').forEach(t=>t.setAttribute('aria-selected','false'));
    tab.setAttribute('aria-selected','true');
    const t = tab.dataset.tab;
    if (t==='launchpad') drawLaunchpad();
    if (t==='dashboard') drawDashboard();
    if (t==='focus') drawFocus();
    if (t==='lifestyle') drawLifestyle();
    if (t==='braintok') drawBrainTok();
  };
});

/* ---------- Tab Content Renderers ---------- */

function drawLaunchpad(){
  screen.innerHTML = `
    <div class="stack">
      <div class="row" style="justify-content:space-between; align-items:center">
        <h2 class="caps">Welcome to Working Memory Lab</h2>
        <button class="primary" onclick="openRealWorldModal()">🌟 Log a Win</button>
      </div>
      <div class="note">
        <div class="caps">Assessments</div>
        <ul>
          <li><b>WM Span (reverse):</b> see items, repeat in reverse order.</li>
          <li><b>Spatial+Verbal Bind:</b> remember triangle positions while judging picture initials.</li>
          <li><b>Cross-modal Binding:</b> remember colored shapes, then recall colors in order.</li>
          <li><b>N-Back (emotion):</b> spacebar on ${coachOn()?'adaptive':'1/2'}-back matches.</li>
        </ul>
      </div>
      <div class="note">
        <div class="caps">Drills</div>
        <ul>
          <li><b>Filter the Positive:</b> click only positive words quickly & accurately.</li>
          <li><b>Mental Multiplication:</b> left→right rolling sum.</li>
        </ul>
      </div>
    </div>`;
}

function drawDashboard() {
  const profile = profileStore.get();
  const s = store.get();
  
  const totalRuns = Object.values(s).flat().length;
  const lastRun = Object.values(s).flat().sort((a,b) => new Date(b.ts) - new Date(a.ts))[0];

  // Calculate cognitive domain scores
  const domainScores = calculateDomainScores(s, profile);
  
  // Calculate streak data
  const streakData = updateStreak(s);

  screen.innerHTML = `
    <div class="stack">
      <div class="row" style="justify-content:space-between">
        <h2 class="caps">Analytics Dashboard</h2>
        <button onclick="viewProfile()">⚙️ Profile</button>
      </div>
      
      <!-- Cognitive Domain Scores -->
      <div class="split">
        <div class="card stack domain-card" data-domain="attention" style="cursor:pointer">
          <div class="caps tight">Attention</div>
          <div class="big">${domainScores.attention.current}%</div>
          <div class="muted">
            ${domainScores.attention.trend > 0 ? '↗' : domainScores.attention.trend < 0 ? '↘' : '→'} 
            ${domainScores.attention.change >= 0 ? '+' : ''}${domainScores.attention.change}% vs baseline
          </div>
          <div class="muted" style="font-size:11px">N-Back, Filter tasks</div>
        </div>
        <div class="card stack domain-card" data-domain="verbal" style="cursor:pointer">
          <div class="caps tight">Verbal WM</div>
          <div class="big">${domainScores.verbal.current}%</div>
          <div class="muted">
            ${domainScores.verbal.trend > 0 ? '↗' : domainScores.verbal.trend < 0 ? '↘' : '→'} 
            ${domainScores.verbal.change >= 0 ? '+' : ''}${domainScores.verbal.change}% vs baseline
          </div>
          <div class="muted" style="font-size:11px">Span, Multiplication</div>
        </div>
        <div class="card stack domain-card" data-domain="spatial" style="cursor:pointer">
          <div class="caps tight">Spatial WM</div>
          <div class="big">${domainScores.spatial.current}%</div>
          <div class="muted">
            ${domainScores.spatial.trend > 0 ? '↗' : domainScores.spatial.trend < 0 ? '↘' : '→'} 
            ${domainScores.spatial.change >= 0 ? '+' : ''}${domainScores.spatial.change}% vs baseline
          </div>
          <div class="muted" style="font-size:11px">Spatial, Cross-modal</div>
        </div>
      </div>

      <!-- Training Streak Calendar -->
      <div class="card stack">
        <h3 class="caps tight">Training Activity</h3>
        <div class="row">
          <div><span class="big ok">${streakData.current}</span> <span class="muted">Current streak</span></div>
          <div><span class="big warn">${streakData.longest}</span> <span class="muted">Longest streak</span></div>
          <div><span class="big">${totalRuns}</span> <span class="muted">Total sessions</span></div>
        </div>
        <div id="streak-calendar" class="streak-calendar"></div>
      </div>

      <!-- Real-World Wins -->
      <div class="card stack">
        <div class="row" style="justify-content:space-between">
          <h3 class="caps tight">Real-World Wins 🌟</h3>
          <button class="primary" id="logWinBtn">+ Log a Win</button>
        </div>
        <div id="recent-wins"></div>
      </div>

      <!-- Lifestyle-Performance Correlation -->
      <div id="lifestyle-correlation"></div>

      <!-- PWA Analytics Section -->
      <div class="card stack pwa-analytics">
        <h3 class="caps tight">PWA Analytics</h3>
        <div id="pwa-metrics" class="row" style="flex-wrap:wrap; gap:12px"></div>
        <div class="sep"></div>
        <div class="caps tight">Recent Activity</div>
        <div id="pwa-activity"></div>
      </div>

      <!-- Performance Trends -->
      <div class="card stack">
        <div class="caps">Performance Trends (last 10 sessions)</div>
        <canvas id="chart1" width="600" height="180"></canvas>
        <div class="muted">• WM Span (level) • N-Back (accuracy %) • Filter-Positive (accuracy %) • Mult (correct%)</div>
      </div>
    </div>
  `;
  
  // Chart drawing logic
  const recent = (key) => (s[key]||[]).slice(-10);
  const spanLv = recent('span').map(r=> r.bestLevel ?? r.level ?? parseSpanFromScore(r.scoreStr));
  const nbackAcc = recent('nback').map(r=> r.acc2 ?? r.acc1 ?? parseNAcc(r.scoreStr));
  const filterAcc = recent('filterPos').map(r=> r.acc ?? parseFilterAcc(r.scoreStr));
  const multAcc = recent('mult').map(r=> r.acc ?? parseMultAcc(r.scoreStr));
  drawMiniChart($('#chart1'), [
    {name:'Span L', data: spanLv, min:0, max:5},
    {name:'NBack %', data: nbackAcc, min:0, max:100},
    {name:'Filter %', data: filterAcc, min:0, max:100},
    {name:'Mult %', data: multAcc, min:0, max:100},
  ]);

  // Render streak calendar
  renderStreakCalendar(streakData.activity);

  // Render recent wins
  renderRecentWins();

  // Render lifestyle correlation insights
  renderLifestyleCorrelation();

  // Render PWA analytics
  renderPWAAnalytics();

  // Add click handlers for domain cards
  document.querySelectorAll('.domain-card').forEach(card => {
    card.onclick = () => drawDomainChart(card.dataset.domain);
  });

  // Add "Log a Win" button handler
  $('#logWinBtn').onclick = openRealWorldModal;
}

function drawFocus() {
  const focusHistory = focusStore.get();
  screen.innerHTML = `
    <div class="stack">
      <h2 class="caps">Focus Mode</h2>

function runFocusSession(minutes) {
  const durationMs = minutes * 60 * 1000;
  const end = Date.now() + durationMs;
  
  $('#focusForm').style.display = 'none';
  const timerDisplay = $('#focus-timer-display');
  timerDisplay.style.display = 'flex';

  const timerInterval = setInterval(() => {
    const remaining = end - Date.now();
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerDisplay.textContent = "Session Complete!";
      focusStore.push({ duration: minutes, ts: new Date().toISOString() });
      renderFocusHistory();
      $('#focusForm').style.display = 'flex';
      timerDisplay.style.display = 'none';
      new Audio('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123941/Yodel_Sound_Effect.mp3').play();
      return;
    }
    const remainingMinutes = Math.floor(remaining / 60000);
    const remainingSeconds = Math.floor((remaining % 60000) / 1000).toString().padStart(2, '0');
    timerDisplay.textContent = `${remainingMinutes}:${remainingSeconds}`;
  }, 1000);
}

function renderFocusHistory() {
  const history = focusStore.get();
  const historyEl = $('#focus-history');
  if (!history.length) {
    historyEl.innerHTML = `<p class="muted">No sessions logged yet.</p>`;
    return;
  }
  historyEl.innerHTML = history.map(s => `
    <div class="scoreline">
      <span>${s.duration} minute session</span>
      <span class="mono muted">${new Date(s.ts).toLocaleString()}</span>
    </div>
  `).join('');
}

async function runQuickDemo() {
  screen.innerHTML = `
    <div class="stack" style="text-align:center">
      <h2 class="caps">Quick Demo: 1-Back Test</h2>

  await wait(1500);

  const faces = ['😊','😎','🤔','😴','😁'];
  const trials = 5;
  let matches = 0;
  let hits = 0;

  for (let i = 0; i < trials; i++) {
    const isMatch = i > 0 && Math.random() > 0.6;
    const current = isMatch ? faces[faces.length - 1] : sample(faces, 1)[0];
    faces.push(current);

    if (isMatch) matches++;

    const responded = await showDemoStimulus(current, 1200);
    if (isMatch && responded) hits++;
  }

  screen.innerHTML = `
    <div class="stack" style="text-align:center; max-width:400px; margin:auto">
      <h2 class="caps ok">Demo Complete!</h2>
      <p class="muted">You caught ${hits} out of ${matches} matches. Nice work!</p>

    </div>
  `;

  await new Promise(resolve => { window.continueAfterDemo = resolve; });
}

function showDemoStimulus(face, duration) {
  return new Promise(resolve => {
    const faceEl = $('#demoFace');
    if (!faceEl) { resolve(false); return; }
    
    faceEl.textContent = face;
    let responded = false;

    const keyHandler = (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        responded = true;
      }
    };

    document.addEventListener('keydown', keyHandler);

    setTimeout(() => {
      document.removeEventListener('keydown', keyHandler);
      resolve(responded);
    }, duration);
  });
}

async function runBaselineAssessment() {
  const results = { attention: 0, verbal: 0, spatial: 0 };

  await wait(2000);
  
  const nbackResult = await blockN(1, 20, false); // 1-back, 20 trials, don't save to history
  results.attention = accPct(nbackResult.hits, nbackResult.miss, nbackResult.fa);

  screen.innerHTML = `

function generateUserProfile(baseline, preferences) {
  // Map goal to persona
  const personaMap = {
    'improve': 'struggler',
    'compete': 'competitor',
    'understand': 'scientist'
  };
  const persona = personaMap[preferences.primaryGoal] || 'struggler';

  // Determine weakest domains for recommendations
  const domains = [
    { name: 'nback', score: baseline.attention },
    { name: 'span', score: baseline.verbal },
    { name: 'spatial', score: baseline.spatial }
  ];
  domains.sort((a, b) => a.score - b.score); // Sort by score ascending (weakest first)
  
  const recommendations = domains.map(d => d.name); // Weakest first

  return {
    created: new Date().toISOString(),
    persona: persona,
    baseline: {
      attention: Math.round(baseline.attention),
      verbal: Math.round(baseline.verbal),
      spatial: Math.round(baseline.spatial)
    },
    preferences: {
      style: preferences.trainingStyle,
      sessionLength: preferences.sessionLength
    },
    recommendations: recommendations,
    onboardingComplete: true
  };
}

// Helper function for testing: determine persona from preferences
function determinePersona(preferences) {
  const goalMap = {
    'improve': 'struggler',
    'compete': 'competitor',
    'perform': 'competitor',
    'understand': 'scientist'
  };
  return goalMap[preferences.goal] || goalMap[preferences.primaryGoal] || 'struggler';
}

// Helper function for testing: get recommendations based on baseline
function getRecommendations(baseline) {
  const recommendations = [];
  
  // Find weakest domain(s)
  const domains = [
    { tasks: ['nback', 'filterPos'], score: baseline.attention, name: 'attention' },
    { tasks: ['span', 'mult'], score: baseline.verbal, name: 'verbal' },
    { tasks: ['spatial', 'crossmodal'], score: baseline.spatial, name: 'spatial' }
  ];
  
  // Sort by score ascending (weakest first)
  domains.sort((a, b) => a.score - b.score);
  
  // Recommend tasks for the weakest domain first
  domains.forEach(domain => {
    domain.tasks.forEach(task => {
      if (!recommendations.includes(task)) {
        recommendations.push(task);
      }
    });
  });
  
  return recommendations;
}

/* ---------- 1) WM Span ---------- */
async function runSpan(doSave = true){
  const levels = [1,2,3,4,5];
  let bestLevel = 0;
  for (const lv of levels){
    const words = spanLists[lv];
    const ok = await spanTrial(lv, words, doSave);
    if (ok){ bestLevel = lv; } else break;
  }
  if (doSave) {
    const pb = isPersonalBest('span', bestLevel);
    const scoreStr = `Best L${bestLevel}`;
    store.push('span',{label:'Best level', scoreStr, bestLevel, personalBest: pb});
    toast(`WM Span · ${scoreStr}${pb ? ' 🏆 New PB!' : ''}`);
  }
  return bestLevel;
}
function spanTrial(level, words, doSave = true){
  return new Promise(async resolve=>{
    screen.innerHTML = `
      <div class="stack">
        <h2>WM Span – Level ${level}</h2>
        <div class="muted">Remember these words. Then type them <b>in reverse order</b>.</div>
        <div id="show" class="big center" style="min-height:80px"></div>
        <div class="sep"></div>
        <form id="f" class="row">
          <input id="ans" class="mono" placeholder="type reversed list (comma/space ok)" style="flex:1;padding:10px;border-radius:8px;border:1px solid #31435f;background:#0f1720;color:var(--ink)" />
          <button class="primary" type="submit">Submit</button>
        </form>
      </div>`;
    const show = $('#show');
    for (const w of words){ show.textContent = w; await wait(900); show.textContent = ''; await wait(250); }
    $('#ans').focus();
    $('#f').onsubmit = (e)=>{
      e.preventDefault();
      const got = $('#ans').value.trim().replace(/[, ]+/g,' ').split(' ').filter(Boolean).map(x=>x.toLowerCase());
      const target = [...words].reverse().map(x=>x.toLowerCase());
      const pass = arraysEqual(got, target);
      if (doSave) {
        show.innerHTML = pass ? `<span class="ok">Correct</span>` : `<span class="err">Incorrect</span> <span class="muted mono">→ ${target.join(' ')}</span>`;
      }
      setTimeout(()=>resolve(pass), 900);
    };
  });
}

/* ---------- 2) Spatial + Verbal ---------- */
async function runSpatial(){
  let level = 1, cleared=0;
  const maxLevel = 3;
  while (level<=maxLevel){
    const ok = await spatialLevel(level);
    if (ok){ cleared++; level++; } else break;
  }
  const pb = isPersonalBest('spatial', cleared);
  store.push('spatial',{level:level-1, cleared, scoreStr:`${cleared}/${maxLevel}`, personalBest: pb});
  toast(`Spatial+Verbal · ${cleared}/${maxLevel}${pb ? ' 🏆 New PB!' : ''}`);
}
function spatialLevel(level, doSave = true){
  const steps = level+1; // L1=2, L2=3, L3=4
  const seq = [];
  const positions = ['top','left','right'];
  for (let i=0;i<steps;i++){
    const pos = positions[Math.floor(Math.random()*3)];
    const letter = String.fromCharCode(65 + Math.floor(Math.random()*26));
    const pic = pictures[Math.floor(Math.random()*pictures.length)];
    seq.push({pos, letter, pic, match: pic[0].toUpperCase()===letter});
  }
  return new Promise(async resolve=>{
    screen.innerHTML = `
      <div class="stack">
        <h2>Spatial + Verbal – Level ${level}</h2>
        <div class="muted">Memorize the triangle for each letter; answer if the picture starts with it. Then recall positions in order.</div>
        <div class="letterBubble" id="bubble">?</div>
        <div class="photoBox" id="photo">—</div>
        <div class="pyramid">
          <div class="tri" data-pos="top" title="Top"></div>
          <div class="tri" data-pos="left" title="Left"></div>
          <div class="tri" data-pos="right" title="Right"></div>
        </div>
        <div class="row center">
          <button id="yes">Picture starts with letter</button>
          <button id="no">No</button>
        </div>
        <div id="phase" class="muted center">Memorize…</div>
      </div>`;
    const bubble = $('#bubble'), photo=$('#photo'), phase=$('#phase');
    const tris = Array.from(document.querySelectorAll('.tri'));
    let respOk=0;

    for (const item of seq){
      tris.forEach(t=>t.classList.remove('mark'));
      bubble.textContent = item.letter; photo.textContent = item.pic;
      const t = tris.find(x=>x.dataset.pos===item.pos); t.classList.add('mark');
      await wait(1200); t.classList.remove('mark'); bubble.textContent = '…'; photo.textContent = '…';
      phase.textContent = 'Does picture start with the letter?';
      const ok = await yesNo(); if (ok === item.match) respOk++;
      phase.textContent = 'Memorize…'; await wait(300);
    }

    // Recall phase
    phase.textContent = 'Recall: click positions in order'; bubble.textContent = '↺'; photo.textContent = 'Recall';
    let recallIdx=0; const needed = seq.map(s=>s.pos);
    tris.forEach(t=>{ t.classList.remove('mark','wrong','correct'); t.onclick = ()=>{
      if (recallIdx>=needed.length) return;
      const expect = needed[recallIdx];
      if (t.dataset.pos===expect){ t.classList.add('correct'); recallIdx++; if (recallIdx===needed.length){
        const pass = respOk===seq.length;
        if (doSave) {
            phase.innerHTML = pass? `<span class="ok">Cleared</span>` : `<span class="warn">Order ok; verbal misses ${seq.length-respOk}</span>`;
        }
        setTimeout(()=>resolve(pass), 1000);
      }} else { 
          if(doSave) phase.innerHTML = `<span class="err">Wrong order</span>`; 
          setTimeout(()=>resolve(false), 900); 
      }
    };});
  });
}
function yesNo(){ return new Promise(res=>{ const y=$('#yes'), n=$('#no'); const onY=()=>{cleanup();res(true)}; const onN=()=>{cleanup();res(false)}; function cleanup(){ y.removeEventListener('click',onY); n.removeEventListener('click',onN);} y.addEventListener('click',onY); n.addEventListener('click',onN); }); }

/* ---------- 2.5) Cross-modal Binding ---------- */
async function runCrossModal(){
  let level = 1, cleared=0;
  const maxLevel = 3;
  while (level<=maxLevel){
    const ok = await crossModalLevel(level);
    if (ok){ cleared++; level++; } else break;
  }
  const pb = isPersonalBest('crossmodal', cleared);
  store.push('crossmodal',{level:level-1, cleared, scoreStr:`${cleared}/${maxLevel}`, personalBest: pb});
  toast(`Cross-modal · ${cleared}/${maxLevel}${pb ? ' 🏆 New PB!' : ''}`);
}
function crossModalLevel(level){
  const steps = level+1; // L1=2, L2=3, L3=4
  const seq = [];
  for (let i=0;i<steps;i++){
    const color = shapeBank.colors[Math.floor(Math.random()*shapeBank.colors.length)];
    const shape = shapeBank.shapes[Math.floor(Math.random()*shapeBank.shapes.length)];
    seq.push({color, shape});
  }
  return new Promise(async resolve=>{
    screen.innerHTML = `
      <div class="stack">
        <h2>Cross-modal Binding – Level ${level}</h2>
        <div class="muted">Memorize the color of each shape. Then recall the colors in order.</div>
        <div id="shape-display" class="center" style="min-height:120px"></div>
        <div id="recall-grid" class="center" style="flex-wrap:wrap;gap:10px;margin-top:10px"></div>
        <div id="phase" class="muted center">Memorize…</div>
      </div>`;
    const shapeDisplay = $('#shape-display');
    const recallGrid = $('#recall-grid');
    const phase = $('#phase');

    for (const item of seq){
      shapeDisplay.innerHTML = `<div class="shape" style="background-color:${item.color}; border-radius:${item.shape==='circle'?'50%':item.shape==='triangle'?'0':'10px'}; clip-path:${item.shape==='triangle'?'polygon(50% 0, 0 100%, 100% 100%)':'none'}"></div>`;
      await wait(1200);
      shapeDisplay.innerHTML = '';
      await wait(300);
    }

    phase.textContent = 'Recall: click colors in order';
    const colorChoices = shuffle([...shapeBank.colors]);
    recallGrid.innerHTML = colorChoices.map(c => `<div class="shape" style="background-color:${c}" data-color="${c}"></div>`).join('');

    let recallIdx=0;
    const needed = seq.map(s=>s.color);
    document.querySelectorAll('#recall-grid .shape').forEach(el => {
      el.onclick = () => {
        if (recallIdx >= needed.length) return;
        const expect = needed[recallIdx];
        if (el.dataset.color === expect){
          el.style.border = '3px solid #35bf88';
          recallIdx++;
          if (recallIdx === needed.length){
            phase.innerHTML = `<span class="ok">Cleared</span>`;
            setTimeout(()=>resolve(true), 1000);
          }
        } else {
          el.style.border = '3px solid #d0657a';
          phase.innerHTML = `<span class="err">Wrong order</span>`;
          setTimeout(()=>resolve(false), 900);
        }
      };
    });
  });
}

/* ---------- 3) N-Back ---------- */
async function runNBack(opts={}, doSave = true){
  const adaptive = coachOn();
  if (adaptive){
    const nbackHistory = store.get().nback || [];
    const startN = decideNFromHistory(nbackHistory);
    const b = await blockN(startN, startN===1?50:60, doSave);
    const acc = accPct(b.hits,b.miss,b.fa);
    // If strong performance at 1-back, auto add a 2-back block
    if (startN===1 && acc>=85 && b.fa<=2){
      const b2 = await blockN(2,60, doSave);
      if (doSave) finishNBack({b1:b, b2});
    } else {
      if (doSave) finishNBack(startN===1?{b1:b}:{b2:b});
    }
  } else {
    const b1 = await blockN(1,45, doSave);
    const b2 = await blockN(2,60, doSave);
    if (doSave) finishNBack({b1,b2});
  }
}
function decideNFromHistory(sessions){
  // Accept array of sessions or single session for backward compat
  if (!sessions) return 1;
  const arr = Array.isArray(sessions) ? sessions : [sessions];
  if (arr.length === 0) return 1;

  // Take last 3 sessions for rolling window
  const recent = arr.slice(-3);

  // Calculate rolling averages
  let acc2Sum = 0, acc2Count = 0;
  let acc1Sum = 0, acc1Count = 0;

  recent.forEach(s => {
    const a2 = Number.isFinite(s.acc2) ? s.acc2 : 0;
    const a1 = Number.isFinite(s.acc1) ? s.acc1 : parseNAcc(s.scoreStr);
    if (s.acc2 !== undefined) { acc2Sum += a2; acc2Count++; }
    if (s.acc1 !== undefined || a1 > 0) { acc1Sum += a1; acc1Count++; }
  });

  const avgAcc2 = acc2Count > 0 ? acc2Sum / acc2Count : 0;
  const avgAcc1 = acc1Count > 0 ? acc1Sum / acc1Count : 0;

  // Decision logic with rolling averages
  if (avgAcc2 >= 75) return 2;  // Consistently good at 2-back
  if (avgAcc1 >= 85) return 2;  // Ready to try 2-back
  return 1;
}
function finishNBack({b1,b2}){
  const scoreStr = `${b1?`1-back H/M/FA ${b1.hits}/${b1.miss}/${b1.fa}`:''}${b1&&b2?' · ':''}${b2?`2-back ${b2.hits}/${b2.miss}/${b2.fa}`:''}`;
  const acc1 = b1? accPct(b1.hits,b1.miss,b1.fa) : undefined;
  const acc2 = b2? accPct(b2.hits,b2.miss,b2.fa) : undefined;
  const pb = isPersonalBest('nback', {acc1, acc2});
  store.push('nback',{scoreStr, acc1, acc2, fa1:b1?.fa, fa2:b2?.fa, personalBest: pb});
  toast(`N-Back · ${scoreStr}${pb ? ' 🏆 New PB!' : ''}`);
}
function accPct(h,m,fa){ const t=h+m; return t? Math.round((h/t)*100) : 0; }
async function blockN(n, secs=60, doSave = true){
  const stream=[]; const flat=[...emoHappy,...emoSad,...emoNeutral];
  for (let i=0;i<40;i++){ stream.push(flat[Math.floor(Math.random()*flat.length)]); }
  for (let i=5;i<stream.length;i+=Math.floor(6+Math.random()*6)){ stream[i]=stream[i-n]??stream[i]; }
  return new Promise(async resolve=>{
    screen.innerHTML = `
      <div class="stack">
        <h2>N-Back (${n}-back) – ${secs}s</h2>
        <div class="muted">Press <span class="kbd">Space</span> when current word matches the word ${n} back.</div>
        <div class="center big" style="height:80px"><span id="stim">+</span></div>
        <div class="row center">
          <div>Hits: <b id="hits">0</b></div>
          <div>Misses: <b id="miss">0</b></div>
          <div>False Alarms: <b id="fa">0</b></div>
          <div class="timer">Time: <b id="t">${secs}</b>s</div>
        </div>
      </div>`;
    let i=0,hits=0,miss=0,fa=0; let canPress=true; const stim=$('#stim');
    const timerEl = $('#t');
    let timerInterval;
    if (doSave) {
        timerInterval = setInterval(()=>{ const left=parseInt(timerEl.textContent,10)-1; timerEl.textContent=left; if (left<=0){ clearInterval(timerInterval); document.onkeydown=null; finish();}},1000);
    }
    document.onkeydown=(e)=>{ if (e.code==='Space'&&canPress){ const target=(i>=n)&&(stream[i]===stream[i-n]); if (target) hits++; else fa++; canPress=false; if(doSave){$('#hits').textContent=hits; $('#fa').textContent=fa;} }};
    async function step(){
      if (i>=stream.length || (doSave && parseInt(timerEl.textContent,10) <= 0)){ finish(); return; }
      stim.textContent=stream[i]; canPress=true; await wait(1300);
      const target=(i>=n)&&(stream[i]===stream[i-n]); if (target&&canPress){ miss++; if(doSave) $('#miss').textContent=miss; }
      canPress=false; i++; await wait(250); step();
    } 
    step();
    function finish(){ 
        if(doSave) document.onkeydown=null; 
        if(timerInterval) clearInterval(timerInterval);
        resolve({hits,miss,fa,totalTargets:stream.filter((w,idx)=>idx>=n&&w===stream[idx-n]).length}); 
    }
  });
}

/* ---------- 4) Filter Positive ---------- */
async function runFilterPos(){
  const pool=[...sample(wordBank.positive,6), ...sample(wordBank.negative,5), ...sample(wordBank.neutral,5)]; shuffle(pool);
  return new Promise(resolve=>{
    screen.innerHTML = `
      <div class="stack">
        <h2>Filter the Positive</h2>
        <div class="muted">Click only the <b>positive</b> words as fast/accurate as possible.</div>
        <div class="row"><span class="timer">Time: <b id="t">0.0</b>s</span> <span>Accuracy: <b id="acc">100%</b></span></div>
        <div id="bank" class="wordBank"></div>
        <div id="done" class="muted"></div>
      </div>`;
    const t0=performance.now(); let clicks=0, correct=0; const bank=$('#bank');
    pool.forEach(w=>{
      const el=document.createElement('div'); el.className='chip'; el.textContent=w;
      el.onclick=()=>{
        clicks++; const isPos=wordBank.positive.includes(w);
        if (isPos){ correct++; el.classList.add('good'); } else { el.classList.add('bad'); }
        el.style.pointerEvents='none'; const acc = Math.round((correct/clicks)*100); $('#acc').textContent = `${acc}%`;
        if (Array.from(bank.children).every(x=> x.classList.contains('good') || !wordBank.positive.includes(x.textContent))){
          const secs=((performance.now()-t0)/1000).toFixed(1); $('#t').textContent=secs;
          const accFinal = Math.round((correct/clicks)*100);
          const pb = isPersonalBest('filterPos', {acc: accFinal, time: parseFloat(secs)});
          $('#done').innerHTML = `<span class="ok">Done:</span> ${correct}/${clicks} in <b>${secs}s</b>${pb ? ' 🏆 PB!' : ''}`;
          store.push('filterPos',{scoreStr:`${correct}/${clicks} in ${secs}s`, acc:accFinal, time:parseFloat(secs), personalBest: pb});
          setTimeout(resolve, 500);
        }
      };
      bank.appendChild(el);
    });
    (function raf(){ const t=((performance.now()-t0)/1000).toFixed(1); $('#t').textContent=t; if ($('#done').textContent==='') requestAnimationFrame(raf); })();
  });
}

/* ---------- 5) Mental Multiplication ---------- */
async function runMult(){
  const problems = sample(["78x4","33x5","25x8","45x3","23x34","12x24","17x55","64x70"], 6);
  let idx=0, correct=0;
  screen.innerHTML = `
    <div class="stack">
      <h2>Mental Multiplication</h2>
      <div class="muted">Compute left→right with a rolling sum.</div>
      <div id="q" class="big mono"></div>
      <form id="f" class="row">
        <input id="a" class="mono" placeholder="answer" style="flex:1;padding:10px;border-radius:8px;border:1px solid #31435f;background:#0f1720;color:var(--ink)" />
        <button class="primary">Submit</button>
      </form>
      <div id="res" class="muted"></div>
    </div>`;
  const q=$('#q'), f=$('#f'), a=$('#a'), res=$('#res');
  
  function show(){
      if (idx >= problems.length) {
          const acc = Math.round((correct/problems.length)*100);
          const pb = isPersonalBest('mult', acc);
          store.push('mult',{scoreStr:`${correct}/${problems.length}`, acc, personalBest: pb});
          toast(`Mental mult · ${correct}/${problems.length}${pb ? ' 🏆 New PB!' : ''}`);
          drawLaunchpad();
          return;
      }
      q.textContent = problems[idx].replace('x',' × '); 
      a.focus(); 
  }

  show();

  f.onsubmit=(e)=>{
    e.preventDefault();
    const want=multAnswer(problems[idx]); const got=parseInt(a.value,10);
    if (got===want){ correct++; res.innerHTML = `<span class="ok">Correct</span>`; }
    else res.innerHTML = `<span class="err">Incorrect</span> <span class="muted">→ ${want}</span>`;
    idx++; a.value=''; 
    setTimeout(show, 800);
  };
}
function multAnswer(expr){ const [L,R]=expr.split('x').map(Number); return L*R; }

/* ---------- Coach Session Orchestrator ---------- */
async function runCoachSession(){
  if (!coachOn()){ toast('Enable Coach Mode for adaptive flow'); return; }
  toast('Coach Session starting...');

  // 1. Warm-up: Filter Positive
  await runFilterPos();

  // 2. Core: N-Back (adaptive)
  const lastFP = (store.get().filterPos||[]).slice(-1)[0];
  const nbackHistory = store.get().nback || [];
  const startN = decideNFromHistory(nbackHistory);
  const block1 = await blockN(startN, startN===1?50:60);
  const acc1 = accPct(block1.hits,block1.miss,block1.fa);

  if (startN===1 && acc1>=85 && block1.fa<=2){
    toast('Promoting to 2-back!', 'ok');
    const block2 = await blockN(2,60);
    finishNBack({b1:block1,b2:block2});
  } else {
    finishNBack(startN===1?{b1:block1}:{b2:block1});
  }

  // 3. Spatial Binding
  await runSpatial();

  // 4. Finisher: Mental Multiplication
  await runMult();

  toast('Coach Session complete!', 'ok');
  drawLaunchpad();
}

function nv(x){ return (x===undefined||x===null)?'':x; }

function parseSpanFromScore(s){ const m=/L(\d+)/i.exec(s||''); return m? +m[1] : 0; }
function parseNAcc(s){ // fallback: compute rough acc1 from text H/M/FA
  const m=/1-back.*?(\d+)\/(\d+)\/(\d+)/i.exec(s||''); if(!m) return '';
  const [_,h,mi,f]=m.map(Number); return accPct(h,mi,f);
}
function parseFilterAcc(s){ const m=/(\d+)\/(\d+)/.exec(s||''); if(!m) return ''; return Math.round((+m[1]/+m[2])*100); }
function parseMultAcc(s){ const m=/(\d+)\/(\d+)/.exec(s||''); if(!m) return ''; return Math.round((+m[1]/+m[2])*100); }

/* ---------- Analytics Functions ---------- */
function calculateDomainScores(storeData, profile) {
  const domainMap = {
    attention: ['nback', 'filterPos'],
    verbal: ['span', 'mult'],
    spatial: ['spatial', 'crossmodal']
  };

  const baseline = profile?.cognitiveBaseline || { attention: 50, verbal: 50, spatial: 50 };
  const domains = {};

  Object.keys(domainMap).forEach(domain => {
    const tasks = domainMap[domain];
    const recent = tasks.flatMap(taskKey => (storeData[taskKey] || []).slice(-10));
    
    let score = 50; // Default
    if (recent.length > 0) {
      // Calculate average performance for this domain
      const scores = recent.map(r => {
        if (r.type === 'nback') return r.acc2 ?? r.acc1 ?? parseNAcc(r.scoreStr) ?? 50;
        if (r.type === 'filterPos') return r.acc ?? parseFilterAcc(r.scoreStr) ?? 50;
        if (r.type === 'span') {
          const level = r.bestLevel ?? r.level ?? parseSpanFromScore(r.scoreStr);
          return Math.min(100, (level / 5) * 100); // Level 5 = 100%
        }
        if (r.type === 'mult') return r.acc ?? parseMultAcc(r.scoreStr) ?? 50;
        if (r.type === 'spatial') return (r.cleared / 3) * 100;
        if (r.type === 'crossmodal') return (r.cleared / 3) * 100;
        return 50;
      }).filter(s => Number.isFinite(s));
      
      score = scores.length > 0 ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 50;
    }

    const change = score - baseline[domain];
    const trend = change > 2 ? 1 : change < -2 ? -1 : 0;

    domains[domain] = {
      current: Math.min(100, Math.max(0, score)),
      baseline: baseline[domain],
      change: Math.round(change),
      trend
    };
  });

  return domains;
}

function updateStreak(storeData) {
  // Get all unique training days
  const allEntries = Object.values(storeData).flat();
  const dates = allEntries
    .map(entry => new Date(entry.ts).toISOString().slice(0, 10))
    .filter((date, index, self) => self.indexOf(date) === index)
    .sort();

  if (dates.length === 0) {
    return { current: 0, longest: 0, activity: [] };
  }

  // Calculate streaks
  let currentStreak = 0;
  let longestStreak = 0;
  let tempStreak = 1;

  const today = new Date().toISOString().slice(0, 10);
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);

  // Check if current streak is active (trained today or yesterday)
  const lastTrainingDate = dates[dates.length - 1];
  const isStreakActive = lastTrainingDate === today || lastTrainingDate === yesterday;

  for (let i = 1; i < dates.length; i++) {
    const prevDate = new Date(dates[i - 1]);
    const currDate = new Date(dates[i]);
    const diffDays = Math.round((currDate - prevDate) / 86400000);

    if (diffDays === 1) {
      tempStreak++;
    } else {
      longestStreak = Math.max(longestStreak, tempStreak);
      tempStreak = 1;
    }
  }

  longestStreak = Math.max(longestStreak, tempStreak);
  currentStreak = isStreakActive ? tempStreak : 0;

  // Build activity map (last 84 days for 12-week calendar)
  const activityMap = {};
  allEntries.forEach(entry => {
    const date = new Date(entry.ts).toISOString().slice(0, 10);
    activityMap[date] = (activityMap[date] || 0) + 1;
  });

  return {
    current: currentStreak,
    longest: longestStreak,
    activity: activityMap
  };
}

function renderStreakCalendar(activityMap) {
  const calendar = $('#streak-calendar');
  if (!calendar) return;

  const today = new Date();
  const days = [];
  
  // Generate last 84 days (12 weeks)
  for (let i = 83; i >= 0; i--) {
    const date = new Date(today);
    date.setDate(date.getDate() - i);
    const dateStr = date.toISOString().slice(0, 10);
    const count = activityMap[dateStr] || 0;
    const intensity = count === 0 ? 0 : count === 1 ? 1 : count === 2 ? 2 : 3;
    
    days.push({ date: dateStr, count, intensity });
  }

  // Render as grid
  calendar.innerHTML = days.map(day => `
    <div class="calendar-day intensity-${day.intensity}" 
         title="${day.date}: ${day.count} session${day.count !== 1 ? 's' : ''}"
         style="width:10px;height:10px;border-radius:2px;background:${
           day.intensity === 0 ? '#1c2432' :

}

function formatRelativeTime(timestamp) {
  const now = new Date();
  const then = new Date(timestamp);
  const diffMs = now - then;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);

  if (diffMins < 1) return 'Just now';
  if (diffMins < 60) return `${diffMins} minute${diffMins !== 1 ? 's' : ''} ago`;
  if (diffHours < 24) return `${diffHours} hour${diffHours !== 1 ? 's' : ''} ago`;
  if (diffDays < 7) return `${diffDays} day${diffDays !== 1 ? 's' : ''} ago`;
  if (diffDays < 30) return `${Math.floor(diffDays / 7)} week${Math.floor(diffDays / 7) !== 1 ? 's' : ''} ago`;
  return then.toLocaleDateString();
}

function calculateLifestyleCorrelations(taskData, lifestyleData) {
  // Match task sessions with lifestyle data by date
  const taskSessions = Object.values(taskData).flat();
  const matchedDays = [];

  taskSessions.forEach(session => {
    const date = new Date(session.ts).toISOString().slice(0, 10);
    const lifestyle = lifestyleData[date];
    
    if (lifestyle) {
      // Calculate performance score for this session
      let performance = 0;
      
      if (session.type === 'nback') {
        performance = session.acc2 || session.acc1 || parseNAcc(session.scoreStr) || 0;
      } else if (session.type === 'span') {
        const level = session.bestLevel || session.level || parseSpanFromScore(session.scoreStr) || 0;
        performance = (level / 5) * 100; // Normalize to 0-100
      } else if (session.type === 'spatial') {
        const cleared = session.cleared || 0;
        performance = (cleared / 3) * 100; // Normalize to 0-100
      } else if (session.type === 'filterPos') {
        performance = session.acc || parseFilterAcc(session.scoreStr) || 0;
      } else if (session.type === 'mult') {
        performance = session.acc || parseMultAcc(session.scoreStr) || 0;
      }

      matchedDays.push({
        date,
        performance,
        sleep: lifestyle.sleep || 7,
        exercise: lifestyle.exercise || 0,
        stress: lifestyle.stress || 5
      });
    }
  });

  if (matchedDays.length < 3) {
    return null;
  }

  // Calculate correlations
  const correlations = [];
  
  // Sleep correlation
  const sleepCorr = calculateCorrelation(
    matchedDays.map(d => d.sleep),
    matchedDays.map(d => d.performance)
  );
  correlations.push({ factor: 'Sleep Quality', value: sleepCorr, type: 'sleep' });

  // Exercise correlation
  const exerciseCorr = calculateCorrelation(
    matchedDays.map(d => d.exercise),
    matchedDays.map(d => d.performance)
  );
  correlations.push({ factor: 'Exercise', value: exerciseCorr, type: 'exercise' });

  // Stress correlation (negative is expected)
  const stressCorr = calculateCorrelation(
    matchedDays.map(d => d.stress),
    matchedDays.map(d => d.performance)
  );
  correlations.push({ factor: 'Stress Level', value: stressCorr, type: 'stress' });

  // Sort by absolute correlation strength
  correlations.sort((a, b) => Math.abs(b.value) - Math.abs(a.value));

  // Generate summary
  let summary = '';
  const strongest = correlations[0];
  if (Math.abs(strongest.value) > 0.3) {
    if (strongest.type === 'sleep' && strongest.value > 0) {
      summary = 'Better sleep is strongly associated with improved performance!';
    } else if (strongest.type === 'exercise' && strongest.value > 0) {
      summary = 'More exercise correlates with better cognitive performance!';
    } else if (strongest.type === 'stress' && strongest.value < 0) {
      summary = 'Lower stress levels are linked to better performance!';
    }
  }

  return {
    correlations,
    matchedDays: matchedDays.length,
    summary
  };
}

function calculateCorrelation(x, y) {
  // Pearson correlation coefficient
  const n = x.length;
  if (n === 0) return 0;

  const sumX = x.reduce((a, b) => a + b, 0);
  const sumY = y.reduce((a, b) => a + b, 0);
  const sumXY = x.reduce((sum, xi, i) => sum + xi * y[i], 0);
  const sumX2 = x.reduce((sum, xi) => sum + xi * xi, 0);
  const sumY2 = y.reduce((sum, yi) => sum + yi * yi, 0);

  const numerator = n * sumXY - sumX * sumY;
  const denominator = Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));

  if (denominator === 0) return 0;
  
  return numerator / denominator;
}

function getCorrelationDescription(corr) {
  const absValue = Math.abs(corr.value);
  
  if (corr.type === 'sleep') {
    if (corr.value > 0.3) return 'More sleep → better performance';
    if (corr.value < -0.3) return 'More sleep → worse performance (unusual)';
    return 'Sleep shows weak correlation with performance';
  }
  
  if (corr.type === 'exercise') {
    if (corr.value > 0.3) return 'More exercise → better performance';
    if (corr.value < -0.3) return 'More exercise → worse performance (check recovery)';
    return 'Exercise shows weak correlation with performance';
  }
  
  if (corr.type === 'stress') {
    if (corr.value > 0.3) return 'Higher stress → better performance (arousal effect)';
    if (corr.value < -0.3) return 'Higher stress → worse performance';
    return 'Stress shows weak correlation with performance';
  }
  
  return 'Weak correlation detected';
}

/* ---------- Mini chart (no deps) ---------- */
function drawMiniChart(canvas, series){
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, pad=28;
  ctx.clearRect(0,0,W,H);
  // axes
  ctx.strokeStyle='#23324a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad, pad/2); ctx.lineTo(pad, H-pad); ctx.lineTo(W-pad/2, H-pad); ctx.stroke();
  // grid
  for(let i=0;i<4;i++){ const y=pad + i*((H-2*pad)/4); ctx.strokeStyle='#1c283f'; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad/2,y); ctx.stroke(); }
  // plot each series
  const colors = ['#7cf6a4','#6ad3ff','#ffcc66','#ff768b','#c18bff'];
  series.forEach((s,si)=>{
    const d = s.data; if(!d||!d.length) return;
    const max = (Number.isFinite(s.max)?s.max: Math.max(...d,1));
    const min = (Number.isFinite(s.min)?s.min: Math.min(...d,0));
    const n = d.length;
    ctx.strokeStyle = colors[si%colors.length]; ctx.lineWidth=2; ctx.beginPath();
    d.forEach((v,i)=>{
      if (!Number.isFinite(v)) return;
      const x = pad + i*((W-2*pad)/Math.max(n-1,1));
      const y = H-pad - ((v-min)/(max-min||1))*(H-2*pad);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    // label
    ctx.fillStyle = colors[si%colors.length]; ctx.font='12px system-ui,Segoe UI';
    ctx.fillText(s.name, W - pad - 110, pad + 14*si + 6);
  });
}

  pwaAnalyticsStore.push({

    timestamp: new Date().toISOString()
  });
  
  // Wait for the user to respond to the prompt
  deferredPrompt.userChoice.then((choiceResult) => {

    if (launchpadTab && launchpadTab.getAttribute('aria-selected') !== 'true') {
      launchpadTab.click();
      e.preventDefault();

  }
  
  // Question mark - show keyboard shortcuts
  if (e.key === '?' && e.shiftKey) {
    showKeyboardShortcuts();
    e.preventDefault();
  }
});

    right: 0;
    bottom: 0;
    background: rgba(0,0,0,.7);
    z-index: 1999;
  `;
  
  document.body.appendChild(overlay);
  document.body.appendChild(modal);
  
  const close = () => {
    modal.remove();
    overlay.remove();
  };
  
  modal.querySelector('#closeShortcuts').onclick = close;
  overlay.onclick = close;
  modal.querySelector('#closeShortcuts').focus();
  
  // Escape to close
  const escHandler = (e) => {
    if (e.key === 'Escape') {
      close();
      document.removeEventListener('keydown', escHandler);
    }
  };
  document.addEventListener('keydown', escHandler);
}

// Focus trap for modals
function trapFocus(element) {
  const focusableElements = element.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  const firstElement = focusableElements[0];
  const lastElement = focusableElements[focusableElements.length - 1];
  
  element.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    
    if (e.shiftKey) {
      if (document.activeElement === firstElement) {
        lastElement.focus();
        e.preventDefault();
      }
    } else {
      if (document.activeElement === lastElement) {
        firstElement.focus();
        e.preventDefault();
      }
    }
  });
}

// Auto-focus first input when screen changes
const screenObserver = new MutationObserver(() => {
  const firstInput = screen.querySelector('input, button, [tabindex="0"]');
  if (firstInput && document.activeElement === document.body) {
    setTimeout(() => firstInput.focus(), 100);
  }
});
screenObserver.observe(screen, { childList: true });

// Announce screen reader messages
function announceToScreenReader(message) {
  const announcement = document.createElement('div');
  announcement.setAttribute('role', 'status');
  announcement.setAttribute('aria-live', 'polite');
  announcement.setAttribute('aria-atomic', 'true');
  announcement.style.cssText = `
    position: absolute;
    left: -10000px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  `;
  announcement.textContent = message;
  document.body.appendChild(announcement);
  setTimeout(() => announcement.remove(), 1000);
}

// Enhance toast for screen readers
const originalToast = window.toast;
window.toast = function(msg, type = 'info') {
  announceToScreenReader(msg);
  if (originalToast) originalToast(msg, type);
};

/* ---------- Performance Optimizations ---------- */

// Lazy load dashboard components
let dashboardDataCache = null;
let dashboardCacheTime = 0;
const CACHE_DURATION = 60000; // 1 minute

function getCachedDashboardData() {
  const now = Date.now();
  if (dashboardDataCache && (now - dashboardCacheTime < CACHE_DURATION)) {
    return dashboardDataCache;
  }
  return null;
}

function setCachedDashboardData(data) {
  dashboardDataCache = data;
  dashboardCacheTime = Date.now();
}

// Invalidate cache when scores change
const originalPush = store.push;
store.push = function(...args) {
  dashboardDataCache = null;
  
  // Check for persona validation survey trigger
  const result = originalPush.apply(this, args);
  checkPersonaSurveyTrigger();
  
  return result;
};

function checkPersonaSurveyTrigger() {
  const profile = profileStore.get();
  if (!profile || !profile.persona) return;
  
  // Check if already responded
  if (profile.personaValidation) {
    // If dismissed, never show again
    if (profile.personaValidation.action === 'dismissed') return;
    
    // If reminded later, check if enough sessions have passed
    if (profile.personaValidation.action === 'remind_later') {
      const sessionsSinceReminder = Object.values(store.get()).flat().filter(entry => 
        new Date(entry.ts) > new Date(profile.personaValidation.timestamp)
      ).length;
      if (sessionsSinceReminder < 5) return; // Wait 5 more sessions
    } else {
      // Already submitted
      return;
    }
  }
  
  // Check total sessions
  const totalSessions = Object.values(store.get()).flat().length;
  if (totalSessions < 3) return;
  
  // Show survey
  setTimeout(() => openPersonaValidationSurvey(), 1000); // Small delay after task completion
}

// Paginate scores display
function renderScoresPaginated(page = 1, perPage = 10) {
  const s = store.get();
  const scores = $('#scores');
  if (!scores) return;
  
  const allEntries = Object.entries(s).flatMap(([key, arr]) =>
    (arr || []).map(r => ({ ...r, key }))
  ).sort((a, b) => new Date(b.ts) - new Date(a.ts));
  
  const totalPages = Math.ceil(allEntries.length / perPage);
  const startIdx = (page - 1) * perPage;
  const endIdx = startIdx + perPage;
  const pageEntries = allEntries.slice(startIdx, endIdx);
  
  if (pageEntries.length === 0) {
    scores.innerHTML = '<div class="muted">No scores recorded yet. Complete a task to see results here.</div>';
    return;
  }
  
  const keyMeta = {
    span: 'WM Span',
    nback: 'N-Back',
    spatial: 'Spatial+Verbal',
    crossmodal: 'Cross-modal',
    filterPos: 'Filter Positive',
    mult: 'Mental Mult'
  };
  
  const fmt = new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  
  let html = '<div class="stack" style="gap:4px">';
  pageEntries.forEach(r => {
    const left = keyMeta[r.key] || r.key;
    const score = (r.scoreStr ?? r.correct ?? '') + (r.extra ? ` ${r.extra}` : '');
    html += `<div class="scoreline"><span>${left}</span><span>${score} · ${fmt.format(new Date(r.ts))}</span></div>`;
  });
  html += '</div>';
  
  if (totalPages > 1) {
    html += `<div class="row" style="justify-content:center; margin-top:12px; gap:8px">`;
    if (page > 1) {
      html += `<button onclick="renderScoresPaginated(${page - 1}, ${perPage})" aria-label="Previous page">← Prev</button>`;
    }
    html += `<span class="muted">Page ${page} of ${totalPages}</span>`;
    if (page < totalPages) {
      html += `<button onclick="renderScoresPaginated(${page + 1}, ${perPage})" aria-label="Next page">Next →</button>`;
    }
    html += `</div>`;
  }
  
  scores.innerHTML = html;
}

// Replace original renderScores with paginated version
window.renderScores = function() {
  renderScoresPaginated(1, 10);
};
