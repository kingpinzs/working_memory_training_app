<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0f1522" />
<meta name="description" content="Train your brain with scientifically-backed working memory exercises" />
<title>Working Memory Lab</title>
<link rel="manifest" href="/manifest.json" />
<style>
  :root{
    --bg:#0b0f14; --card:#121822; --ink:#e8f0ff; --muted:#9db0cc;
    --brand:#6ad3ff; --accent:#7cf6a4; --warn:#ffcc66; --err:#ff768b;
    --ok:#63f5b4; --line:#243043; --btn:#1c2432; --btn-hi:#233045; --focus:#3a66ff;
  }
  *{box-sizing:border-box}
  body{margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,Noto Sans; color:var(--ink);
    background:linear-gradient(180deg,#0a0e13 0%, #0b1220 100%) fixed;}
  header{position:sticky; top:0; z-index:5; background:rgba(11,15,20,.8); backdrop-filter: blur(10px); border-bottom:1px solid var(--line);}
  .wrap{max-width:1100px; margin:0 auto; padding:16px;}
  .flex{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  h1{font-size:20px; margin:0}
  .pill{display:inline-flex; align-items:center; padding:10px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--btn); color:var(--ink); cursor:pointer; user-select:none; min-height:44px}
  .pill[aria-selected="true"]{background:var(--btn-hi); border-color:#3a4a66}
  main{padding:16px}
  .grid{display:grid; gap:16px}
  @media (min-width:980px){ .grid{grid-template-columns:1.2fr .8fr} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 10px 20px rgba(0,0,0,.25)}
  h2{margin:0 0 12px 0; font-size:16px}
  .muted{color:var(--muted)}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  button,.btn{background:var(--btn); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer; min-height:44px; min-width:44px}
  button:hover,.btn:hover{background:var(--btn-hi)}
  button.primary{background:linear-gradient(180deg,#1e2a42,#26405e); border-color:#3b5377}
  .kbd{font-family:ui-monospace,Menlo,Consolas,monospace; background:#0d1420; border:1px solid #1f2a3d; padding:2px 6px; border-radius:6px}
  .stack{display:flex; flex-direction:column; gap:10px}
  .center{display:flex; align-items:center; justify-content:center}
  .big{font-size:22px}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}
  .split{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .tag{display:inline-block; padding:4px 8px; border:1px solid var(--line); border-radius:999px; color:var(--muted)}
  .scoreline{display:flex; justify-content:space-between; border-bottom:1px dashed #22304a; padding:6px 0}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .caps{letter-spacing:.04em; text-transform:uppercase; font-weight:600; color:#b6c9e8}
  .sep{height:1px; background:var(--line); margin:8px 0}
  .note{padding:10px; background:#0f1522; border:1px solid #1f2c45; border-radius:10px}
  /* Triangle board */
  .pyramid{width:240px; height:210px; position:relative; margin:8px auto;}
  .tri{position:absolute; width:0; height:0; border-left:60px solid transparent; border-right:60px solid transparent; border-bottom:100px solid #1c2b44; filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)); cursor:pointer; opacity:.85}
  .tri:hover{filter:brightness(1.2)}
  .tri[data-pos="top"]{left:60px; top:0}
  .tri[data-pos="left"]{left:0; top:90px}
  .tri[data-pos="right"]{left:120px; top:90px}
  .tri.mark{border-bottom-color:#3b6df0}
  .tri.correct{border-bottom-color:#2bb673}
  .tri.wrong{border-bottom-color:#c24}
  .letterBubble{margin:8px auto; width:46px; height:46px; border-radius:50%; background:#1a2336; border:1px solid #2a3b5e; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700}
  .photoBox{height:110px; display:flex; align-items:center; justify-content:center; border:1px solid #23324a; border-radius:10px; background:#0f1725; font-weight:700; letter-spacing:.5px}
  .wordBank{display:flex; gap:8px; flex-wrap:wrap}
  .chip{padding:10px 12px; border:1px solid #31435f; background:#142034; border-radius:8px; cursor:pointer; user-select:none; min-height:44px}
  .chip.good{outline:2px solid #35bf88} .chip.bad{outline:2px solid #d0657a}
  .timer{font-variant-numeric:tabular-nums}
  .hidden{display:none !important}
  .tight{margin:-4px 0 -2px}
  .switch{display:inline-flex; align-items:center; gap:8px}
  .switch input{appearance:none; width:40px; height:22px; border-radius:999px; background:#2a3954; position:relative; outline:none; cursor:pointer; border:1px solid #31435f}
  .switch input:checked{background:#2f6a4f}
  .switch input::after{content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#dfe9ff; border-radius:50%; transition:transform .2s}
  .switch input:checked::after{transform:translateX(18px)}
  canvas{width:100%; height:180px; background:#0f1725; border:1px solid #23324a; border-radius:10px}
  .shape{width:80px; height:80px; margin:10px; border-radius:10px; cursor:pointer}
  /* Streak calendar */
  .streak-calendar{display:flex; flex-wrap:wrap; gap:3px; margin-top:12px; max-width:600px}
  .calendar-day{transition:transform .2s}
  .calendar-day:hover{transform:scale(1.2)}
  .domain-card{transition:all .2s}
  .domain-card:hover{transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,0,0,.35); border-color:#3a4a66}
  /* Phase 4.5: Enhanced button hover effects */
  button,.btn,.chip,.pill{transition:all .15s ease}
  button:hover,.btn:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.3)}
  button:active,.btn:active{transform:translateY(0); box-shadow:none}
  button.primary:hover{box-shadow:0 6px 16px rgba(59,83,119,.4)}
  button.recommended{position:relative; border-color:#2a8a5a; box-shadow:0 0 0 1px #2a8a5a inset}
  button.recommended::after{content:'★'; position:absolute; top:-6px; right:-6px; font-size:12px; background:#2a8a5a; color:#fff; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; line-height:1}
  /* Phase 4.1: Task completion animation */
  @keyframes successPulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  .task-success{animation:successPulse .4s ease-out}
  /* Session 8: Tab transition animation */
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .tab-content-fade{animation:fadeIn .2s ease-out}
  /* Session 8: Skip link for accessibility */
  .skip-link{position:absolute;top:-50px;left:16px;background:var(--brand);color:#000;padding:10px 16px;border-radius:8px;font-weight:600;z-index:999;text-decoration:none;transition:top .2s}
  .skip-link:focus{top:10px}
  /* Phase 4.2: Reduced motion support */
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}
    .calendar-day:hover,.domain-card:hover,button:hover,.btn:hover{transform:none}
  }
  /* Phase 7.1: High contrast mode */
  body.high-contrast{
    --bg:#000; --card:#111; --ink:#fff; --muted:#ccc;
    --brand:#00ffff; --accent:#00ff00; --warn:#ffff00; --err:#ff0000;
    --ok:#00ff00; --line:#666; --btn:#222; --btn-hi:#444; --focus:#00f;
  }
  body.high-contrast .card{border-width:2px}
  body.high-contrast button,body.high-contrast .btn,body.high-contrast .pill{border-width:2px}
  body.high-contrast .muted{color:#ccc}
  body.high-contrast .braintok-card{border-width:2px}
  /* Phase 5: BrainTok swipeable cards */
  .braintok-container{position:relative; height:400px; width:100%; max-width:350px; margin:0 auto; perspective:1000px}
  .braintok-card{position:absolute; top:0; left:0; right:0; height:100%; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; transition:transform .3s ease, opacity .3s ease; touch-action:pan-y; user-select:none; cursor:grab}
  .braintok-card:active{cursor:grabbing}
  .braintok-card.swiping{transition:none}
  .braintok-card.swipe-left{transform:translateX(-120%) rotate(-15deg); opacity:0}
  .braintok-card.swipe-right{transform:translateX(120%) rotate(15deg); opacity:0}
  .braintok-card.swipe-up{transform:translateY(-120%) scale(0.8); opacity:0}
  .braintok-card .task-icon{font-size:48px; margin-bottom:16px}
  .braintok-card .task-question{font-size:28px; font-weight:700; margin-bottom:24px}
  .braintok-card .task-hint{font-size:14px; color:var(--muted)}
  .braintok-progress{display:flex; justify-content:center; gap:8px; margin-top:20px}
  .braintok-progress .dot{width:10px; height:10px; border-radius:50%; background:var(--line)}
  .braintok-progress .dot.active{background:var(--brand)}
  .braintok-progress .dot.done{background:var(--ok)}
  .braintok-actions{display:flex; justify-content:center; gap:16px; margin-top:16px}
  .braintok-actions button{min-width:80px; font-size:24px; padding:12px 20px; border-radius:12px}
  .braintok-feedback{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:64px; animation:feedbackPop .4s ease-out forwards; pointer-events:none}
  @keyframes feedbackPop{0%{transform:translate(-50%,-50%) scale(0); opacity:1}50%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1); opacity:0}}
</style>
</head>
<body onload="initializeApp()">
<a href="#screen" class="skip-link">Skip to main content</a>
<header>
  <div class="wrap flex">
    <h1>Working Memory Lab</h1>
            <nav class="flex" role="tablist" aria-label="Modes">
      <div class="pill" role="tab" aria-selected="true" data-tab="launchpad">Launchpad</div>
      <div class="pill" role="tab" aria-selected="false" data-tab="dashboard">Dashboard</div>
      <div class="pill" role="tab" aria-selected="false" data-tab="focus">Focus</div>
      <div class="pill" role="tab" aria-selected="false" data-tab="lifestyle">Lifestyle</div>
      <div class="pill" role="tab" aria-selected="false" data-tab="braintok">BrainTok</div>
    </nav>
    <div class="muted" style="margin-left:auto">All data stays local • No tracking</div>
  </div>
</header>

<main class="wrap grid">
  <section id="stage" class="card stack">
    <div id="screen"></div>
  </section>

  <aside class="stack">
    <div class="card stack">
      <h2 class="caps">Launchpad</h2>
      <div class="row" title="Adaptive difficulty across tasks">
        <label class="switch">
          <input id="coachToggle" type="checkbox" aria-label="Toggle Coach Mode for adaptive sessions">
        </label>
        <div><b>Coach Mode</b> <span class="muted">adaptive session</span></div>
      </div>
      <div class="row" title="High contrast colors for accessibility">
        <label class="switch">
          <input id="contrastToggle" type="checkbox" aria-label="Toggle high contrast mode">
        </label>
        <div><b>High Contrast</b> <span class="muted">accessibility</span></div>
      </div>
      <div class="sep"></div>
      <div class="stack">
        <div class="caps tight">Assessments</div>
        <div class="split" role="group" aria-label="Assessment tasks">
          <button class="primary" data-run="span" aria-label="Start WM Span reverse order task">WM Span (reverse)</button>
          <button class="primary" data-run="spatial" aria-label="Start Spatial and Verbal Binding task">Spatial+Verbal Bind</button>
          <button data-run="crossmodal" aria-label="Start Cross-modal Binding task">Cross-modal Binding</button>
          <button data-run="nback" aria-label="Start N-Back emotion task">1-Back / 2-Back (emotion)</button>
          <button data-run="dualNback" aria-label="Start Dual N-Back task">Dual N-Back</button>
          <button data-run="audioNback" aria-label="Start Audio N-Back task">Audio N-Back</button>
          <button data-run="corsi" aria-label="Start Corsi Block-Tapping task">Corsi Blocks</button>
          <button data-run="opSpan" aria-label="Start Operation Span task">Operation Span</button>
        </div>
        <div class="caps tight">Drills</div>
        <div class="split" role="group" aria-label="Cognitive drills">
          <button data-run="filterPos" aria-label="Start Filter the Positive task">Filter the Positive</button>
          <button data-run="mult" aria-label="Start Mental Multiplication task">Mental Multiplication</button>
        </div>
        <div class="caps tight">Programs</div>
        <div class="split" role="group" aria-label="Training programs">
          <button id="coachSession" aria-label="Start Coach Session program">Run Coach Session</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="caps">Scoreboard</h2>
      <div id="scores" class="stack" role="region" aria-label="Recent scores and achievements"></div>
      <div class="sep"></div>
      <div class="row" style="flex-wrap:wrap">
        <button id="exportCsv" aria-label="Export scores as CSV file">Export CSV</button>
        <button id="exportJson" aria-label="Export all data as JSON file">Export JSON</button>
        <button id="resetScores" aria-label="Reset all scores - this action cannot be undone">Reset scores</button>
      </div>
    </div>
  </aside>
</main>

<script>
/* ---------- Infra & persistence ---------- */
const $ = s => document.querySelector(s);
const screen = $('#screen');

function Store(key, isArray = false) {
  this.key = key;
  this.isArray = isArray;
}
Store.prototype.get = function() {
  try {
    const defaultValue = this.isArray ? '[]' : '{}';
    const storedValue = localStorage.getItem(this.key);
    if (this.key === 'wmLabProfile' && storedValue === 'null') return null;
    return JSON.parse(storedValue || defaultValue);
  } catch (err) {
    console.warn(`[Store] Failed to parse ${this.key}:`, err);
    this.handleCorruptedData();
    return this.isArray ? [] : {};
  }
};
Store.prototype.set = function(data) {
  try {
    const serialized = JSON.stringify(data);
    localStorage.setItem(this.key, serialized);
  } catch (err) {
    if (err.name === 'QuotaExceededError') {
      this.handleQuotaExceeded();
    } else {
      console.error(`[Store] Failed to save ${this.key}:`, err);
      toast('⚠️ Failed to save data. Please try again.', 'warn');
    }
  }
};
Store.prototype.handleQuotaExceeded = function() {
  toast('⚠️ Storage quota exceeded. Cleaning old data...', 'warn');
  const data = this.get();
  if (this.isArray) {
    // Keep only last 100 entries for array stores
    const trimmed = data.slice(0, 100);
    try {
      localStorage.setItem(this.key, JSON.stringify(trimmed));
      toast('✅ Storage optimized. Oldest entries removed.');
    } catch {
      toast('❌ Unable to free storage. Please export and reset data.', 'err');
    }
  } else {
    // For object stores, trim each array to last 50 entries
    const trimmed = {};
    for (const [key, val] of Object.entries(data)) {
      trimmed[key] = Array.isArray(val) ? val.slice(-50) : val;
    }
    try {
      localStorage.setItem(this.key, JSON.stringify(trimmed));
      toast('✅ Storage optimized. Oldest entries removed.');
    } catch {
      toast('❌ Unable to free storage. Please export and reset data.', 'err');
    }
  }
};
Store.prototype.handleCorruptedData = function() {
  const backup = localStorage.getItem(this.key);
  if (backup) {
    const backupKey = `${this.key}_backup_${Date.now()}`;
    try {
      localStorage.setItem(backupKey, backup);
      console.info(`[Store] Corrupted data backed up to ${backupKey}`);
    } catch {
      console.warn('[Store] Could not backup corrupted data');
    }
  }
  localStorage.removeItem(this.key);
  toast('⚠️ Data corruption detected. Reset to defaults.', 'warn');
};
// Generic push method for array-based stores
Store.prototype.push = function(entry) {
  if (!this.isArray) {
    console.warn(`[Store] Push called on non-array store ${this.key}`);
    return;
  }
  const data = this.get();
  data.push(entry);
  this.set(data);
};

const store = new Store('wmLab');
const profileStore = new Store('wmLabProfile');
const focusStore = new Store('wmLabFocus', true); // true for array-based history
const lifestyleStore = new Store('wmLabLifestyle');
const realWorldStore = new Store('wmLabRealWorld', true); // Real-world wins log

// Special-casing for main score store to match original object structure
store.push = function(key, entry) {
  const s = this.get();
  s[key] = s[key] || [];
  s[key].push({ ...entry, type: key, ts: entry.ts ?? new Date().toISOString() });
  this.set(s);
  if (document.querySelector('#scores')) renderScores();
  // Update personal best displays on launchpad
  if (typeof updateLaunchpadPBs === 'function') updateLaunchpadPBs();
};
store.reset = function() {
  localStorage.removeItem(this.key);
  if (document.querySelector('#scores')) renderScores();
  drawLaunchpad();
  toast('Scores have been reset.');
};

// Personal best tracking helpers
function getPersonalBest(taskKey, metric = 'bestLevel') {
  const s = store.get();
  const records = s[taskKey] || [];
  if (records.length === 0) return null;

  // Different tasks have different "best" metrics
  switch (taskKey) {
    case 'span':
      return Math.max(...records.map(r => r.bestLevel || 0));
    case 'spatial':
    case 'crossmodal':
      return Math.max(...records.map(r => r.cleared || 0));
    case 'nback':
    case 'audioNback':
      // Best is highest acc3, acc2, or acc1
      const acc3s = records.filter(r => r.acc3 !== undefined).map(r => r.acc3);
      const acc2s = records.filter(r => r.acc2 !== undefined).map(r => r.acc2);
      const acc1s = records.filter(r => r.acc1 !== undefined).map(r => r.acc1);
      if (acc3s.length > 0) return { acc3: Math.max(...acc3s) };
      if (acc2s.length > 0) return { acc2: Math.max(...acc2s) };
      if (acc1s.length > 0) return { acc1: Math.max(...acc1s) };
      return null;
    case 'filterPos':
      // Best is highest accuracy with lowest time
      const bestAcc = Math.max(...records.map(r => r.acc || 0));
      const bestTime = Math.min(...records.filter(r => r.acc === bestAcc).map(r => r.time || Infinity));
      return { acc: bestAcc, time: bestTime };
    case 'mult':
      return Math.max(...records.map(r => r.acc || 0));
    default:
      return null;
  }
}

function isPersonalBest(taskKey, newValue) {
  const best = getPersonalBest(taskKey);
  if (best === null) return true; // First entry is always a personal best

  switch (taskKey) {
    case 'span':
      return newValue > best;
    case 'spatial':
    case 'crossmodal':
      return newValue > best;
    case 'nback':
    case 'audioNback':
      // Check if new acc1, acc2, or acc3 beats the previous best
      if (typeof newValue === 'object') {
        if (newValue.acc3 !== undefined && best.acc3 !== undefined) {
          return newValue.acc3 > best.acc3;
        }
        if (newValue.acc2 !== undefined && best.acc2 !== undefined) {
          return newValue.acc2 > best.acc2;
        }
        if (newValue.acc1 !== undefined && best.acc1 !== undefined) {
          return newValue.acc1 > best.acc1;
        }
      }
      return false;
    case 'filterPos':
      // Better accuracy, or same accuracy with faster time
      if (newValue.acc > best.acc) return true;
      if (newValue.acc === best.acc && newValue.time < best.time) return true;
      return false;
    case 'mult':
      return newValue > best;
    default:
      return false;
  }
}

// Get performance comparison text to previous session
function getPerformanceComparison(taskKey, newValue) {
  const s = store.get();
  const records = s[taskKey] || [];
  if (records.length < 1) return ''; // No previous to compare

  const prev = records[records.length - 1]; // Last session
  let diff = 0;
  let label = '';

  switch (taskKey) {
    case 'span':
      diff = newValue - (prev.bestLevel || 0);
      label = diff > 0 ? `+${diff} level` : diff < 0 ? `${diff} level` : 'same level';
      break;
    case 'spatial':
    case 'crossmodal':
      diff = newValue - (prev.cleared || 0);
      label = diff > 0 ? `+${diff}` : diff < 0 ? `${diff}` : 'same';
      break;
    case 'nback':
    case 'audioNback':
      // Compare acc1, acc2, or acc3 depending on what's available
      const prevAcc = prev.acc3 ?? prev.acc2 ?? prev.acc1 ?? 0;
      const newAcc = newValue.acc3 ?? newValue.acc2 ?? newValue.acc1 ?? 0;
      diff = newAcc - prevAcc;
      label = diff > 0 ? `+${diff}%` : diff < 0 ? `${diff}%` : 'same';
      break;
    case 'filterPos':
      diff = newValue.acc - (prev.acc || 0);
      label = diff > 0 ? `+${diff}%` : diff < 0 ? `${diff}%` : 'same';
      break;
    case 'mult':
      diff = newValue - (prev.acc || 0);
      label = diff > 0 ? `+${diff}%` : diff < 0 ? `${diff}%` : 'same';
      break;
    default:
      return '';
  }

  if (diff === 0) return '';
  return ` (${label} vs last)`;
}

// Persona-based encouragement messages
function getEncouragement(isGood, isPB) {
  const profile = profileStore.get();
  const persona = profile?.persona || 'struggler';

  if (isPB) {
    // Personal best messages by persona
    const pbMessages = {
      struggler: ['Amazing progress!', 'You did it!', 'Keep building!'],
      competitor: ['New record!', 'Crushing it!', 'Champion level!'],
      scientist: ['Data point recorded', 'Optimal performance', 'Benchmark exceeded']
    };
    const msgs = pbMessages[persona] || pbMessages.struggler;
    return msgs[Math.floor(Math.random() * msgs.length)];
  }

  if (isGood) {
    // Good performance messages
    const goodMessages = {
      struggler: ['Great effort!', 'Nice work!', 'Well done!'],
      competitor: ['Strong showing!', 'Keep pushing!', 'Challenge accepted!'],
      scientist: ['Solid results', 'Within expected range', 'Consistent data']
    };
    const msgs = goodMessages[persona] || goodMessages.struggler;
    return msgs[Math.floor(Math.random() * msgs.length)];
  }

  // Encouraging messages for lower performance
  const encourageMessages = {
    struggler: ['Every attempt counts!', 'Progress takes time', 'You\'re building skills'],
    competitor: ['Next time!', 'Room to grow', 'Come back stronger'],
    scientist: ['Variability expected', 'More data needed', 'Part of the process']
  };
  const msgs = encourageMessages[persona] || encourageMessages.struggler;
  return msgs[Math.floor(Math.random() * msgs.length)];
}

// Show inline reset confirmation instead of browser confirm()
function showResetConfirm() {
  const btn = document.getElementById('resetScores');
  if (!btn) return;

  // Create confirm/cancel container
  const parent = btn.parentElement;
  const confirmContainer = document.createElement('div');
  confirmContainer.id = 'resetConfirm';
  confirmContainer.className = 'row';
  confirmContainer.style.gap = '8px';

function runFocusSession(minutes) {
  const durationMs = minutes * 60 * 1000;
  const end = Date.now() + durationMs;
  
  $('#focusForm').style.display = 'none';
  const timerDisplay = $('#focus-timer-display');
  timerDisplay.style.display = 'flex';

  const timerInterval = setInterval(() => {
    const remaining = end - Date.now();
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerDisplay.textContent = "Session Complete!";
      focusStore.push({ duration: minutes, ts: new Date().toISOString() });
      renderFocusHistory();
      $('#focusForm').style.display = 'flex';
      timerDisplay.style.display = 'none';
      new Audio('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123941/Yodel_Sound_Effect.mp3').play();
      return;
    }
    const remainingMinutes = Math.floor(remaining / 60000);
    const remainingSeconds = Math.floor((remaining % 60000) / 1000).toString().padStart(2, '0');
    timerDisplay.textContent = `${remainingMinutes}:${remainingSeconds}`;
  }, 1000);
}

/* ---------- BrainTok Micro-Tasks ---------- */
const brainTokTasks = {
  mathFlash: () => {
    const ops = ['+', '-', '×'];
    const op = ops[Math.floor(Math.random() * ops.length)];
    let a, b, answer, shown;
    if (op === '+') {
      a = Math.floor(Math.random() * 50) + 10;
      b = Math.floor(Math.random() * 50) + 10;
      answer = a + b;
    } else if (op === '-') {
      a = Math.floor(Math.random() * 50) + 30;
      b = Math.floor(Math.random() * 30) + 5;
      answer = a - b;
    } else {
      a = Math.floor(Math.random() * 12) + 2;
      b = Math.floor(Math.random() * 12) + 2;
      answer = a * b;
    }
    const isCorrect = Math.random() > 0.5;
    shown = isCorrect ? answer : answer + (Math.random() > 0.5 ? Math.floor(Math.random() * 10) + 1 : -Math.floor(Math.random() * 10) - 1);
    return { type: 'mathFlash', icon: '🧮', question: `${a} ${op} ${b} = ${shown}`, hint: 'Is this correct?', correct: isCorrect };
  },
  memoryFlash: () => {
    const sequences = ['🍎🍊🍋', '🔴🟢🔵', '⭐🌙☀️', '🐶🐱🐭', '🚗🚌🚀'];
    const seq = sequences[Math.floor(Math.random() * sequences.length)];
    const chars = [...seq];
    const shuffled = [...chars].sort(() => Math.random() - 0.5);
    const isMatch = Math.random() > 0.5;
    const shown = isMatch ? seq : shuffled.join('');
    return { type: 'memoryFlash', icon: '🧠', question: seq, secondQuestion: shown, hint: 'Same sequence?', correct: isMatch, twoPhase: true };
  },
  wordMatch: () => {
    const categories = {
      'Animals': ['dog', 'cat', 'bird', 'fish', 'lion'],
      'Colors': ['red', 'blue', 'green', 'yellow', 'purple'],
      'Foods': ['apple', 'bread', 'cheese', 'pizza', 'salad'],
      'Numbers': ['one', 'two', 'three', 'four', 'five']
    };
    const catNames = Object.keys(categories);
    const cat = catNames[Math.floor(Math.random() * catNames.length)];
    const words = categories[cat];
    const word = words[Math.floor(Math.random() * words.length)];
    const isMatch = Math.random() > 0.5;
    const shownCat = isMatch ? cat : catNames.filter(c => c !== cat)[Math.floor(Math.random() * (catNames.length - 1))];
    return { type: 'wordMatch', icon: '📝', question: `"${word}" → ${shownCat}?`, hint: 'Correct category?', correct: isMatch };
  }
};

let brainTokState = { cards: [], current: 0, score: 0, phase: 'question' };

function generateBrainTokSession() {
  const tasks = [];
  const types = ['mathFlash', 'memoryFlash', 'wordMatch'];
  for (let i = 0; i < 10; i++) {
    const type = types[i % types.length];
    tasks.push(brainTokTasks[type]());
  }
  return tasks;
}

  brainTokState = { cards: [], current: 0, score: 0, phase: 'question' };
  screen.innerHTML = `

function renderBrainTokCard() {
  const { cards, current, score, phase } = brainTokState;
  if (current >= cards.length) {
    finishBrainTok();
    return;
  }
  const card = cards[current];
  const showSecond = card.twoPhase && phase === 'answer';

  screen.innerHTML = `
    <div class="stack" style="text-align:center">
      <div class="row" style="justify-content:space-between">
        <span class="muted">${current + 1}/${cards.length}</span>

      </div>

          <div class="task-icon">${card.icon}</div>
          <div class="task-question">${showSecond ? card.secondQuestion : card.question}</div>
          <div class="task-hint">${card.twoPhase && phase === 'question' ? 'Remember this!' : card.hint}</div>
        </div>
      </div>
      <div class="braintok-progress">
        ${cards.map((_, i) => `<div class="dot ${i < current ? 'done' : i === current ? 'active' : ''}"></div>`).join('')}
      </div>
      ${card.twoPhase && phase === 'question' ? `
        <div class="braintok-actions">
          <button class="primary" id="btReady">Ready!</button>
        </div>
      ` : `
        <div class="braintok-actions">
          <button id="btNo" style="background:#d0657a">👎</button>
          <button id="btSkip" style="background:#7a8fa8">⏭️</button>
          <button id="btYes" style="background:#35bf88">👍</button>
        </div>
      `}
    </div>
  `;

  const cardEl = document.getElementById('btCard');
  if (card.twoPhase && phase === 'question') {
    document.getElementById('btReady').onclick = () => {
      brainTokState.phase = 'answer';
      renderBrainTokCard();
    };
  } else {
    document.getElementById('btYes').onclick = () => answerBrainTok(true);
    document.getElementById('btNo').onclick = () => answerBrainTok(false);
    document.getElementById('btSkip').onclick = () => skipBrainTok();
    setupBrainTokSwipe(cardEl);
  }
}

function setupBrainTokSwipe(el) {
  let startX = 0, startY = 0, currentX = 0, currentY = 0, isDragging = false;

  const start = (x, y) => { startX = x; startY = y; isDragging = true; el.classList.add('swiping'); };
  const move = (x, y) => {
    if (!isDragging) return;
    currentX = x - startX;
    currentY = y - startY;
    el.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${currentX * 0.05}deg)`;
  };
  const end = () => {
    if (!isDragging) return;
    isDragging = false;
    el.classList.remove('swiping');
    if (currentX > 80) { el.classList.add('swipe-right'); answerBrainTok(true); }
    else if (currentX < -80) { el.classList.add('swipe-left'); skipBrainTok(); }
    else if (currentY < -80) { el.classList.add('swipe-up'); answerBrainTok(true); }
    else if (currentY > 80) { answerBrainTok(false); }
    else { el.style.transform = ''; }
    currentX = 0; currentY = 0;
  };

  el.onmousedown = e => start(e.clientX, e.clientY);
  el.ontouchstart = e => start(e.touches[0].clientX, e.touches[0].clientY);
  document.onmousemove = e => move(e.clientX, e.clientY);
  document.ontouchmove = e => move(e.touches[0].clientX, e.touches[0].clientY);
  document.onmouseup = end;
  document.ontouchend = end;
}

function answerBrainTok(userSaidYes) {
  const card = brainTokState.cards[brainTokState.current];
  const isCorrect = userSaidYes === card.correct;
  if (isCorrect) brainTokState.score++;
  showBrainTokFeedback(isCorrect);
  brainTokState.current++;
  brainTokState.phase = 'question';
  setTimeout(renderBrainTokCard, 400);
}

function skipBrainTok() {
  brainTokState.current++;
  brainTokState.phase = 'question';
  setTimeout(renderBrainTokCard, 300);
}

function showBrainTokFeedback(isCorrect) {
  const fb = document.createElement('div');
  fb.className = 'braintok-feedback';
  fb.textContent = isCorrect ? '✅' : '❌';

async function runQuickDemo() {
  screen.innerHTML = `
    <div class="stack" style="text-align:center">
      <h2 class="caps">Quick Demo: 1-Back Test</h2>
      <p class="muted">Press <span class="kbd">Space</span> when you see the <b>same face twice in a row</b></p>
      <div id="demoFace" class="photoBox" style="font-size:60px; height:150px">😊</div>
      <p class="muted">Get ready...</p>
    </div>
  `;

  await wait(1500);

  const faces = ['😊','😎','🤔','😴','😁'];
  const trials = 5;
  let matches = 0;
  let hits = 0;

  for (let i = 0; i < trials; i++) {
    const isMatch = i > 0 && Math.random() > 0.6;
    const current = isMatch ? faces[faces.length - 1] : sample(faces, 1)[0];
    faces.push(current);

    if (isMatch) matches++;

    const responded = await showDemoStimulus(current, 1200);
    if (isMatch && responded) hits++;
  }

  screen.innerHTML = `
    <div class="stack" style="text-align:center; max-width:400px; margin:auto">
      <h2 class="caps ok">Demo Complete!</h2>
      <p class="muted">You caught ${hits} out of ${matches} matches. Nice work!</p>
      <p style="margin-top:20px">The full assessment will test your <b>Attention</b>, <b>Verbal Memory</b>, and <b>Spatial Memory</b> to create your personalized training plan.</p>
      <button class="primary" style="margin-top:20px" onclick="continueAfterDemo()">Continue to Full Assessment</button>
    </div>
  `;

  await new Promise(resolve => { window.continueAfterDemo = resolve; });
}

function showDemoStimulus(face, duration) {
  return new Promise(resolve => {
    const faceEl = $('#demoFace');
    if (!faceEl) { resolve(false); return; }
    
    faceEl.textContent = face;
    let responded = false;

    const keyHandler = (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        responded = true;
      }
    };

    document.addEventListener('keydown', keyHandler);

    setTimeout(() => {
      document.removeEventListener('keydown', keyHandler);
      resolve(responded);
    }, duration);
  });
}

async function runBaselineAssessment() {
  const results = { attention: 0, verbal: 0, spatial: 0 };

  // Test 1: Attention (1-back, 20 trials)
  screen.innerHTML = `
    <div class="stack" style="text-align:center">
      <h2 class="caps">Test 1 of 3: Attention</h2>
      <p class="muted">Press <span class="kbd">Space</span> when you see the same emoji twice in a row</p>
      <p class="muted">About 30 seconds</p>
    </div>
  `;
  await wait(2000);
  
  const nbackResult = await blockN(1, 20, false); // 1-back, 20 trials, don't save to history
  results.attention = accPct(nbackResult.hits, nbackResult.miss, nbackResult.fa);

  // Test 2: Verbal Memory (Span, 3 trials at level 3)
  screen.innerHTML = `
    <div class="stack" style="text-align:center">
      <h2 class="caps">Test 2 of 3: Verbal Memory</h2>
      <p class="muted">Remember digits and repeat them in <b>reverse order</b></p>
      <p class="muted">3 quick trials</p>
    </div>
  `;
  await wait(2000);

  let verbalCorrect = 0;
  for (let i = 0; i < 3; i++) {
    const passed = await spanTrial(3, spanLists[3], false);
    if (passed) verbalCorrect++;
  }
  results.verbal = Math.round((verbalCorrect / 3) * 100);

  // Test 3: Spatial Memory (Spatial binding, level 1)
  screen.innerHTML = `
    <div class="stack" style="text-align:center">
      <h2 class="caps">Test 3 of 3: Spatial Memory</h2>
      <p class="muted">Remember which triangles were marked, then recall their positions</p>
      <p class="muted">2 quick trials</p>
    </div>
  `;
  await wait(2000);

  let spatialCorrect = 0;
  for (let i = 0; i < 2; i++) {
    const passed = await spatialLevel(1, false);
    if (passed) spatialCorrect++;
  }
  results.spatial = Math.round((spatialCorrect / 2) * 100);

  return results;
}

function generateUserProfile(baseline, preferences) {
  // Map goal to persona
  const personaMap = {
    'improve': 'struggler',
    'compete': 'competitor',
    'understand': 'scientist'
  };
  const persona = personaMap[preferences.primaryGoal] || 'struggler';

  // Determine weakest domains for recommendations
  const domains = [
    { name: 'nback', score: baseline.attention },
    { name: 'span', score: baseline.verbal },
    { name: 'spatial', score: baseline.spatial }
  ];
  domains.sort((a, b) => a.score - b.score); // Sort by score ascending (weakest first)
  
  const recommendations = domains.map(d => d.name); // Weakest first

  return {
    created: new Date().toISOString(),
    persona: persona,
    baseline: {
      attention: Math.round(baseline.attention),
      verbal: Math.round(baseline.verbal),
      spatial: Math.round(baseline.spatial)
    },
    preferences: {
      style: preferences.trainingStyle,
      sessionLength: preferences.sessionLength
    },
    recommendations: recommendations,
    onboardingComplete: true
  };
}

// Helper function for testing: determine persona from preferences
function determinePersona(preferences) {
  const goalMap = {
    'improve': 'struggler',
    'compete': 'competitor',
    'perform': 'competitor',
    'understand': 'scientist'
  };
  return goalMap[preferences.goal] || goalMap[preferences.primaryGoal] || 'struggler';
}

// Helper function for testing: get recommendations based on baseline
function getRecommendations(baseline) {
  const recommendations = [];
  
  // Find weakest domain(s)
  const domains = [
    { tasks: ['nback', 'filterPos'], score: baseline.attention, name: 'attention' },
    { tasks: ['span', 'mult'], score: baseline.verbal, name: 'verbal' },
    { tasks: ['spatial', 'crossmodal'], score: baseline.spatial, name: 'spatial' }
  ];
  
  // Sort by score ascending (weakest first)
  domains.sort((a, b) => a.score - b.score);
  
  // Recommend tasks for the weakest domain first
  domains.forEach(domain => {
    domain.tasks.forEach(task => {
      if (!recommendations.includes(task)) {
        recommendations.push(task);
      }
    });
  });
  
  return recommendations;
}

/* ---------- 1) WM Span ---------- */
async function runSpan(doSave = true){
  const levels = [1,2,3,4,5,6];
  let bestLevel = 0;
  for (const lv of levels){
    const words = getSpanWords(lv); // Use random word list for variety
    const ok = await spanTrial(lv, words, doSave);
    if (ok){ bestLevel = lv; } else break;
  }
  if (doSave) {
    const pb = isPersonalBest('span', bestLevel);
    const cmp = getPerformanceComparison('span', bestLevel);
    const isGood = bestLevel >= 3; // Level 3+ is good
    const encourage = getEncouragement(isGood, pb);
    const scoreStr = `Best L${bestLevel}`;
    store.push('span',{label:'Best level', scoreStr, bestLevel, personalBest: pb});
    toast(`WM Span · ${scoreStr}${pb ? ' 🏆 ' : cmp ? cmp + ' · ' : ' · '}${encourage}`, pb ? 'ok' : isGood ? 'info' : 'info');
  }
  return bestLevel;
}
function spanTrial(level, words, doSave = true){
  return new Promise(async resolve=>{
    screen.innerHTML = `
      <div class="stack">
        <h2>WM Span – Level ${level}</h2>
        <div class="muted">Remember these words. Then type them <b>in reverse order</b>.</div>

          <button class="primary" type="submit">Submit</button>
        </form>
      </div>`;
    const show = $('#show');
    for (const w of words){ show.textContent = w; await wait(900); show.textContent = ''; await wait(250); }
    $('#ans').focus();
    $('#f').onsubmit = (e)=>{

/* ---------- 2) Spatial + Verbal ---------- */
async function runSpatial(){
  let level = 1, cleared=0;
  const maxLevel = 4; // L1=2, L2=3, L3=4, L4=5 items
  let totalVerbal = 0, totalVerbalCorrect = 0;
  let totalSpatial = 0, totalSpatialCorrect = 0;
  while (level<=maxLevel){
    const result = await spatialLevel(level);
    totalVerbal += result.verbalTotal;
    totalVerbalCorrect += result.verbalCorrect;
    totalSpatial += 1;
    if (result.spatialOk) totalSpatialCorrect++;
    if (result.passed){ cleared++; level++; } else break;
  }
  const verbalAcc = totalVerbal > 0 ? Math.round((totalVerbalCorrect / totalVerbal) * 100) : 0;
  const spatialAcc = totalSpatial > 0 ? Math.round((totalSpatialCorrect / totalSpatial) * 100) : 0;
  const pb = isPersonalBest('spatial', cleared);
  const cmp = getPerformanceComparison('spatial', cleared);
  const isGood = cleared >= 2; // 2+ levels is good
  const encourage = getEncouragement(isGood, pb);
  store.push('spatial',{level:level-1, cleared, scoreStr:`${cleared}/${maxLevel}`, verbalAcc, spatialAcc, personalBest: pb});
  toast(`Spatial+Verbal · ${cleared}/${maxLevel}${pb ? ' 🏆 ' : cmp ? cmp + ' · ' : ' · '}${encourage}`, pb ? 'ok' : isGood ? 'info' : 'info');
}
function spatialLevel(level, doSave = true){
  const steps = level+1; // L1=2, L2=3, L3=4
  const seq = [];
  const positions = ['top','left','right'];
  for (let i=0;i<steps;i++){
    const pos = positions[Math.floor(Math.random()*3)];
    const letter = String.fromCharCode(65 + Math.floor(Math.random()*26));
    const pic = pictures[Math.floor(Math.random()*pictures.length)];
    seq.push({pos, letter, pic, match: pic[0].toUpperCase()===letter});
  }
  return new Promise(async resolve=>{
    screen.innerHTML = `
      <div class="stack">
        <h2>Spatial + Verbal – Level ${level}</h2>
        <div class="muted">Memorize the triangle for each letter; answer if the picture starts with it. Then recall positions in order.</div>
        <div class="letterBubble" id="bubble">?</div>
        <div class="photoBox" id="photo">—</div>
        <div class="pyramid">
          <div class="tri" data-pos="top" title="Top"></div>
          <div class="tri" data-pos="left" title="Left"></div>
          <div class="tri" data-pos="right" title="Right"></div>
        </div>
        <div class="row center">
          <button id="yes">Picture starts with letter</button>
          <button id="no">No</button>
        </div>
        <div id="phase" class="muted center">Memorize…</div>
      </div>`;
    const bubble = $('#bubble'), photo=$('#photo'), phase=$('#phase');
    const tris = Array.from(document.querySelectorAll('.tri'));
    let respOk=0;

    for (const item of seq){
      tris.forEach(t=>t.classList.remove('mark'));
      bubble.textContent = item.letter; photo.textContent = item.pic;
      const t = tris.find(x=>x.dataset.pos===item.pos); t.classList.add('mark');
      await wait(1200); t.classList.remove('mark'); bubble.textContent = '…'; photo.textContent = '…';
      phase.textContent = 'Does picture start with the letter?';
      const ok = await yesNo(); if (ok === item.match) respOk++;
      phase.textContent = 'Memorize…'; await wait(300);
    }

    // Recall phase
    phase.textContent = 'Recall: click positions in order'; bubble.textContent = '↺'; photo.textContent = 'Recall';
    let recallIdx=0; const needed = seq.map(s=>s.pos);
    tris.forEach(t=>{ t.classList.remove('mark','wrong','correct'); t.onclick = ()=>{
      if (recallIdx>=needed.length) return;
      const expect = needed[recallIdx];
      if (t.dataset.pos===expect){ t.classList.add('correct'); recallIdx++; if (recallIdx===needed.length){
        const pass = respOk===seq.length;
        if (doSave) {
            phase.innerHTML = pass? `<span class="ok">Cleared</span>` : `<span class="warn">Order ok; verbal misses ${seq.length-respOk}</span>`;
        }
        // Return detailed result object
        setTimeout(()=>resolve({passed: pass, verbalTotal: seq.length, verbalCorrect: respOk, spatialOk: true}), 1000);
      }} else {
          if(doSave) phase.innerHTML = `<span class="err">Wrong order</span>`;
          // Spatial failed
          setTimeout(()=>resolve({passed: false, verbalTotal: seq.length, verbalCorrect: respOk, spatialOk: false}), 900);
      }
    };});
  });
}
function yesNo(){ return new Promise(res=>{ const y=$('#yes'), n=$('#no'); const onY=()=>{cleanup();res(true)}; const onN=()=>{cleanup();res(false)}; function cleanup(){ y.removeEventListener('click',onY); n.removeEventListener('click',onN);} y.addEventListener('click',onY); n.addEventListener('click',onN); }); }

/* ---------- 2.5) Cross-modal Binding ---------- */
async function runCrossModal(){
  let level = 1, cleared=0;
  const maxLevel = 4; // L1=2, L2=3, L3=4, L4=5 items
  while (level<=maxLevel){
    const ok = await crossModalLevel(level);
    if (ok){ cleared++; level++; } else break;
  }
  const pb = isPersonalBest('crossmodal', cleared);
  const cmp = getPerformanceComparison('crossmodal', cleared);
  const isGood = cleared >= 2; // 2+ levels is good
  const encourage = getEncouragement(isGood, pb);
  store.push('crossmodal',{level:level-1, cleared, scoreStr:`${cleared}/${maxLevel}`, personalBest: pb});
  toast(`Cross-modal · ${cleared}/${maxLevel}${pb ? ' 🏆 ' : cmp ? cmp + ' · ' : ' · '}${encourage}`, pb ? 'ok' : isGood ? 'info' : 'info');
}
function crossModalLevel(level){
  const steps = level+1; // L1=2, L2=3, L3=4
  const seq = [];
  for (let i=0;i<steps;i++){
    const color = shapeBank.colors[Math.floor(Math.random()*shapeBank.colors.length)];
    const shape = shapeBank.shapes[Math.floor(Math.random()*shapeBank.shapes.length)];
    seq.push({color, shape});
  }
  return new Promise(async resolve=>{
    screen.innerHTML = `
      <div class="stack">
        <h2>Cross-modal Binding – Level ${level}</h2>
        <div class="muted">Memorize the color of each shape. Then recall the colors in order.</div>
        <div id="shape-display" class="center" style="min-height:120px"></div>
        <div id="recall-grid" class="center" style="flex-wrap:wrap;gap:10px;margin-top:10px"></div>
        <div id="phase" class="muted center">Memorize…</div>
      </div>`;
    const shapeDisplay = $('#shape-display');
    const recallGrid = $('#recall-grid');
    const phase = $('#phase');

    for (const item of seq){
      const clipPath = shapeClipPaths[item.shape] || 'none';
      const borderRadius = item.shape==='circle' ? '50%' : clipPath !== 'none' ? '0' : '10px';
      shapeDisplay.innerHTML = `<div class="shape" style="background-color:${item.color}; border-radius:${borderRadius}; clip-path:${clipPath}"></div>`;
      await wait(1200);
      shapeDisplay.innerHTML = '';
      await wait(300);
    }

    phase.textContent = 'Recall: click colors in order';
    const colorChoices = shuffle([...shapeBank.colors]);
    recallGrid.innerHTML = colorChoices.map(c => `<div class="shape" style="background-color:${c}" data-color="${c}"></div>`).join('');

    let recallIdx=0;
    const needed = seq.map(s=>s.color);
    document.querySelectorAll('#recall-grid .shape').forEach(el => {
      el.onclick = () => {
        if (recallIdx >= needed.length) return;
        const expect = needed[recallIdx];
        if (el.dataset.color === expect){
          el.style.border = '3px solid #35bf88';
          recallIdx++;
          if (recallIdx === needed.length){
            phase.innerHTML = `<span class="ok">Cleared</span>`;
            setTimeout(()=>resolve(true), 1000);
          }
        } else {
          el.style.border = '3px solid #d0657a';
          phase.innerHTML = `<span class="err">Wrong order</span>`;
          setTimeout(()=>resolve(false), 900);
        }
      };
    });
  });
}

/* ---------- 3) N-Back ---------- */
async function runNBack(opts={}, doSave = true){
  // Dismiss mobile keyboard if open
  if (document.activeElement) document.activeElement.blur();
  const adaptive = coachOn();
  if (adaptive){
    const nbackHistory = store.get().nback || [];
    const startN = decideNFromHistory(nbackHistory);
    const trials = startN === 1 ? 50 : startN === 2 ? 60 : 70;
    const b = await blockN(startN, trials, doSave);
    const acc = accPct(b.hits,b.miss,b.fa);

    // Auto-promotion logic
    if (startN === 1 && acc >= 85 && b.fa <= 2){
      const b2 = await blockN(2, 60, doSave);
      if (doSave) finishNBack({b1:b, b2});
    } else if (startN === 2 && acc >= 80 && b.fa <= 3){
      const b3 = await blockN(3, 70, doSave);
      if (doSave) finishNBack({b2:b, b3});
    } else {
      if (doSave) finishNBack(startN === 1 ? {b1:b} : startN === 2 ? {b2:b} : {b3:b});
    }
  } else {
    const b1 = await blockN(1, 45, doSave);
    const b2 = await blockN(2, 60, doSave);
    if (doSave) finishNBack({b1, b2});
  }
}
function decideNFromHistory(sessions){
  // Accept array of sessions or single session for backward compat
  if (!sessions) return 1;
  const arr = Array.isArray(sessions) ? sessions : [sessions];
  if (arr.length === 0) return 1;

  // Take last 3 sessions for rolling window
  const recent = arr.slice(-3);

  // Calculate rolling averages
  let acc3Sum = 0, acc3Count = 0;
  let acc2Sum = 0, acc2Count = 0;
  let acc1Sum = 0, acc1Count = 0;

  recent.forEach(s => {
    const a3 = Number.isFinite(s.acc3) ? s.acc3 : 0;
    const a2 = Number.isFinite(s.acc2) ? s.acc2 : 0;
    const a1 = Number.isFinite(s.acc1) ? s.acc1 : parseNAcc(s.scoreStr);
    if (s.acc3 !== undefined) { acc3Sum += a3; acc3Count++; }
    if (s.acc2 !== undefined) { acc2Sum += a2; acc2Count++; }
    if (s.acc1 !== undefined || a1 > 0) { acc1Sum += a1; acc1Count++; }
  });

  const avgAcc3 = acc3Count > 0 ? acc3Sum / acc3Count : 0;
  const avgAcc2 = acc2Count > 0 ? acc2Sum / acc2Count : 0;
  const avgAcc1 = acc1Count > 0 ? acc1Sum / acc1Count : 0;

  // Decision logic with rolling averages
  if (avgAcc3 >= 70) return 3;  // Consistently decent at 3-back
  if (avgAcc2 >= 80 && acc2Count >= 3) return 3;  // Ready for 3-back
  if (avgAcc2 >= 75) return 2;  // Consistently good at 2-back
  if (avgAcc1 >= 85) return 2;  // Ready to try 2-back
  return 1;
}
function finishNBack({b1,b2,b3}){
  let parts = [];
  if (b1) parts.push(`1-back H/M/FA ${b1.hits}/${b1.miss}/${b1.fa}`);
  if (b2) parts.push(`2-back ${b2.hits}/${b2.miss}/${b2.fa}`);
  if (b3) parts.push(`3-back ${b3.hits}/${b3.miss}/${b3.fa}`);
  const scoreStr = parts.join(' · ');
  const acc1 = b1? accPct(b1.hits,b1.miss,b1.fa) : undefined;
  const acc2 = b2? accPct(b2.hits,b2.miss,b2.fa) : undefined;
  const acc3 = b3? accPct(b3.hits,b3.miss,b3.fa) : undefined;
  // Calculate average RT across all blocks
  const rtVals = [b1?.avgRt, b2?.avgRt, b3?.avgRt].filter(v => v !== null && v !== undefined);
  const avgRt = rtVals.length > 0 ? Math.round(rtVals.reduce((a,b)=>a+b,0) / rtVals.length) : null;
  const pb = isPersonalBest('nback', {acc1, acc2, acc3});
  const cmp = getPerformanceComparison('nback', {acc1, acc2, acc3});
  const bestAcc = Math.max(acc1 || 0, acc2 || 0, acc3 || 0);
  const isGood = bestAcc >= 70; // 70%+ accuracy is good
  const encourage = getEncouragement(isGood, pb);
  store.push('nback',{scoreStr, acc1, acc2, acc3, fa1:b1?.fa, fa2:b2?.fa, fa3:b3?.fa, avgRt, personalBest: pb});
  const rtStr = avgRt ? ` (${avgRt}ms avg)` : '';
  toast(`N-Back · ${scoreStr}${rtStr}${pb ? ' 🏆 ' : cmp ? cmp + ' · ' : ' · '}${encourage}`, pb ? 'ok' : isGood ? 'info' : 'info');
}
function accPct(h,m,fa){ const t=h+m; return t? Math.round((h/t)*100) : 0; }
async function blockN(n, secs=60, doSave = true){
  const stream=[]; const flat=[...emoHappy,...emoSad,...emoNeutral];
  for (let i=0;i<40;i++){ stream.push(flat[Math.floor(Math.random()*flat.length)]); }
  for (let i=5;i<stream.length;i+=Math.floor(6+Math.random()*6)){ stream[i]=stream[i-n]??stream[i]; }
  return new Promise(async resolve=>{
    screen.innerHTML = `
      <div class="stack">
        <h2>N-Back (${n}-back) – ${secs}s</h2>
        <div class="muted">Press <span class="kbd">Space</span> when current word matches the word ${n} back.</div>
        <div class="center big" style="height:80px"><span id="stim">+</span></div>
        <div class="row center">
          <div>Hits: <b id="hits">0</b></div>
          <div>Misses: <b id="miss">0</b></div>
          <div>False Alarms: <b id="fa">0</b></div>
          <div class="timer">Time: <b id="t">${secs}</b>s</div>
        </div>
        <div class="muted" style="text-align:center; font-size:12px">Avg RT: <b id="rtDisplay">--</b>ms</div>
      </div>`;
    let i=0,hits=0,miss=0,fa=0; let canPress=true; const stim=$('#stim');
    const timerEl = $('#t');
    const rtDisplay = $('#rtDisplay');
    let timerInterval;
    let stimStart = 0;
    const rtData = [];

    if (doSave) {
        timerInterval = setInterval(()=>{ const left=parseInt(timerEl.textContent,10)-1; timerEl.textContent=left; if (left<=0){ clearInterval(timerInterval); document.onkeydown=null; finish();}},1000);
    }
    document.onkeydown=(e)=>{
      if (e.code==='Space'&&canPress){
        const rt = performance.now() - stimStart;
        const target=(i>=n)&&(stream[i]===stream[i-n]);
        if (target) {
          hits++;
          rtData.push(rt); // Only record RT for correct hits
          const avgRt = Math.round(rtData.reduce((a,b)=>a+b,0) / rtData.length);
          if(doSave) rtDisplay.textContent = avgRt;
        } else fa++;
        canPress=false;
        if(doSave){$('#hits').textContent=hits; $('#fa').textContent=fa;}
      }
    };
    async function step(){
      if (i>=stream.length || (doSave && parseInt(timerEl.textContent,10) <= 0)){ finish(); return; }
      stim.textContent=stream[i];
      stimStart = performance.now();
      canPress=true;
      await wait(1300);
      const target=(i>=n)&&(stream[i]===stream[i-n]); if (target&&canPress){ miss++; if(doSave) $('#miss').textContent=miss; }
      canPress=false; i++; await wait(250); step();
    }
    step();
    function finish(){
        if(doSave) document.onkeydown=null;
        if(timerInterval) clearInterval(timerInterval);
        const avgRt = rtData.length > 0 ? Math.round(rtData.reduce((a,b)=>a+b,0) / rtData.length) : null;
        resolve({hits,miss,fa,totalTargets:stream.filter((w,idx)=>idx>=n&&w===stream[idx-n]).length,avgRt});
    }
  });
}

const dualNBackLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
const dualNBackPositions = [0, 1, 2, 3, 5, 6, 7, 8];

async function runDualNBack() {
  // Dismiss mobile keyboard if open
  if (document.activeElement) document.activeElement.blur();
  const n = 2;
  const result = await dualNBackBlock(n);
  const posAcc = result.posTotalTargets > 0 ? Math.round((result.posHits / result.posTotalTargets) * 100) : 0;
  const audioAcc = result.audioTotalTargets > 0 ? Math.round((result.audioHits / result.audioTotalTargets) * 100) : 0;
  const pb = isPersonalBest('dualNback', { posAcc, audioAcc, n });
  const avgAcc = Math.round((posAcc + audioAcc) / 2);
  const isGood = avgAcc >= 60;
  const encourage = getEncouragement(isGood, pb);
  const scoreStr = n + '-back: Pos ' + posAcc + '% / Audio ' + audioAcc + '%';
  store.push('dualNback', { scoreStr, n, posHits: result.posHits, posMiss: result.posMiss, posFA: result.posFA, audioHits: result.audioHits, audioMiss: result.audioMiss, audioFA: result.audioFA, posAcc, audioAcc, personalBest: pb });
  toast('Dual N-Back · ' + scoreStr + (pb ? ' 🏆 ' : ' · ') + encourage, pb ? 'ok' : isGood ? 'info' : 'info');
  drawLaunchpad();
}

async function dualNBackBlock(n, secs) {

  for (let i = n; i < trials; i += Math.floor(2 + Math.random() * 2)) { posStream[i] = posStream[i - n]; }
  for (let i = n; i < trials; i += Math.floor(2 + Math.random() * 2)) { if (Math.random() > 0.3) audioStream[i] = audioStream[i - n]; }

  return new Promise(async resolve => {
    // Build UI using DOM methods
    const container = document.createElement('div');

    grid.className = 'dual-grid';
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,60px);gap:8px;justify-content:center;margin:20px 0';

      const cell = document.createElement('div');
      cell.className = 'dual-cell' + (i === 4 ? ' center' : '');
      cell.dataset.pos = i;
      cell.style.cssText = 'width:60px;height:60px;background:' + (i === 4 ? '#0f1720' : '#1a2430') + ';border-radius:8px;transition:background 0.15s';
      grid.appendChild(cell);
    }
    container.appendChild(grid);

    const btnRow = document.createElement('div');
    btnRow.className = 'row center';
    btnRow.style.cssText = 'gap:20px;margin-top:16px';
    const posBtn = document.createElement('button');
    posBtn.id = 'posBtn';
    posBtn.className = 'dual-btn';
    posBtn.style.cssText = 'padding:12px 24px;font-size:16px;min-width:160px';
    posBtn.textContent = 'Position Match (A)';
    const audioBtn = document.createElement('button');
    audioBtn.id = 'audioBtn';
    audioBtn.className = 'dual-btn';
    audioBtn.style.cssText = 'padding:12px 24px;font-size:16px;min-width:160px';
    audioBtn.textContent = 'Audio Match (L)';
    btnRow.appendChild(posBtn);
    btnRow.appendChild(audioBtn);
    container.appendChild(btnRow);

    const statsRow = document.createElement('div');
    statsRow.className = 'row center';
    statsRow.style.cssText = 'gap:16px;margin-top:12px';
    const posStats = document.createElement('div');
    posStats.textContent = 'Pos: ';
    const posHitsEl = document.createElement('span');
    posHitsEl.className = 'ok';
    posHitsEl.id = 'posHits';
    posHitsEl.textContent = '0';
    const posFAEl = document.createElement('span');
    posFAEl.className = 'err';
    posFAEl.id = 'posFA';
    posFAEl.textContent = '0';
    posStats.appendChild(posHitsEl);
    posStats.appendChild(document.createTextNode('/'));
    posStats.appendChild(posFAEl);
    statsRow.appendChild(posStats);

    const audioStats = document.createElement('div');
    audioStats.textContent = 'Audio: ';
    const audioHitsEl = document.createElement('span');
    audioHitsEl.className = 'ok';
    audioHitsEl.id = 'audioHits';
    audioHitsEl.textContent = '0';
    const audioFAEl = document.createElement('span');
    audioFAEl.className = 'err';
    audioFAEl.id = 'audioFA';
    audioFAEl.textContent = '0';
    audioStats.appendChild(audioHitsEl);
    audioStats.appendChild(document.createTextNode('/'));
    audioStats.appendChild(audioFAEl);
    statsRow.appendChild(audioStats);

    const timerDiv = document.createElement('div');
    timerDiv.className = 'timer';
    timerDiv.textContent = 'Time: ';
    const timerEl = document.createElement('b');
    timerEl.id = 't';
    timerEl.textContent = secs;
    timerDiv.appendChild(timerEl);
    timerDiv.appendChild(document.createTextNode('s'));
    statsRow.appendChild(timerDiv);
    container.appendChild(statsRow);

    screen.textContent = '';
    screen.appendChild(container);

    const cells = grid.querySelectorAll('.dual-cell');
    let idx = 0, posHits = 0, posMiss = 0, posFA = 0, audioHits = 0, audioMiss = 0, audioFA = 0;
    let canPressPos = true, canPressAudio = true;

    const timerInterval = setInterval(() => {
      const left = parseInt(timerEl.textContent, 10) - 1;
      timerEl.textContent = left;
      if (left <= 0) { clearInterval(timerInterval); cleanup(); finish(); }

    function speakLetter(letter) {
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(letter);

        utter.volume = 0.8;
        speechSynthesis.speak(utter);
      }
    }

    function handlePosResponse() {
      if (!canPressPos) return;
      const isTarget = idx >= n && posStream[idx] === posStream[idx - n];

    function handleAudioResponse() {
      if (!canPressAudio) return;

      else { audioFA++; audioFAEl.textContent = audioFA; }
      canPressAudio = false;
      audioBtn.style.transform = 'scale(0.95)';
      setTimeout(() => { audioBtn.style.transform = ''; }, 150);
    }

    const keyHandler = (e) => { if (e.code === 'KeyA') handlePosResponse(); if (e.code === 'KeyL') handleAudioResponse(); };
    document.addEventListener('keydown', keyHandler);
    posBtn.onclick = handlePosResponse;
    audioBtn.onclick = handleAudioResponse;

    function cleanup() { document.removeEventListener('keydown', keyHandler); clearInterval(timerInterval); }

    async function step() {
      if (idx >= posStream.length || parseInt(timerEl.textContent, 10) <= 0) { finish(); return; }
      const pos = posStream[idx], letter = audioStream[idx];
      cells.forEach(c => c.style.background = c.dataset.pos === '4' ? '#0f1720' : '#1a2430');
      cells[pos].style.background = 'var(--brand)';
      speakLetter(letter);
      canPressPos = true;
      canPressAudio = true;
      await wait(2500);
      const isPosTarget = idx >= n && posStream[idx] === posStream[idx - n];
      const isAudioTarget = idx >= n && audioStream[idx] === audioStream[idx - n];
      if (isPosTarget && canPressPos) posMiss++;
      if (isAudioTarget && canPressAudio) audioMiss++;
      cells.forEach(c => c.style.background = c.dataset.pos === '4' ? '#0f1720' : '#1a2430');
      canPressPos = false;
      canPressAudio = false;
      idx++;
      await wait(500);
      step();
    }
    step();

    function finish() {
      cleanup();
      const posTotalTargets = posStream.filter((p, i) => i >= n && p === posStream[i - n]).length;
      const audioTotalTargets = audioStream.filter((a, i) => i >= n && a === audioStream[i - n]).length;
      resolve({ posHits, posMiss, posFA, posTotalTargets, audioHits, audioMiss, audioFA, audioTotalTargets });
    }
  });
}

/* ---------- 3.55) Audio N-Back ---------- */
// Audio-only N-Back using spoken letters
const audioNBackLetters = ['B', 'C', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'M', 'N', 'P', 'Q', 'R', 'S', 'T', 'V', 'W', 'X', 'Z'];

async function runAudioNBack() {
  // Dismiss mobile keyboard if open
  if (document.activeElement) document.activeElement.blur();
  const adaptive = coachOn();
  if (adaptive) {
    const history = store.get().audioNback || [];
    const startN = decideAudioNFromHistory(history);
    const trials = startN === 1 ? 40 : startN === 2 ? 50 : 60;
    const b = await audioNBackBlock(startN, trials);
    const acc = accPct(b.hits, b.miss, b.fa);

    // Auto-promotion logic
    if (startN === 1 && acc >= 85 && b.fa <= 2) {
      const b2 = await audioNBackBlock(2, 50);
      finishAudioNBack({b1: b, b2});
    } else if (startN === 2 && acc >= 80 && b.fa <= 3) {
      const b3 = await audioNBackBlock(3, 60);
      finishAudioNBack({b2: b, b3});
    } else {
      finishAudioNBack(startN === 1 ? {b1: b} : startN === 2 ? {b2: b} : {b3: b});
    }
  } else {
    const b1 = await audioNBackBlock(1, 35);
    const b2 = await audioNBackBlock(2, 45);
    finishAudioNBack({b1, b2});
  }
}

function decideAudioNFromHistory(sessions) {
  if (!sessions || sessions.length === 0) return 1;
  const recent = sessions.slice(-3);

  let acc3Sum = 0, acc3Count = 0;
  let acc2Sum = 0, acc2Count = 0;
  let acc1Sum = 0, acc1Count = 0;

  recent.forEach(s => {
    if (s.acc3 !== undefined) { acc3Sum += s.acc3; acc3Count++; }
    if (s.acc2 !== undefined) { acc2Sum += s.acc2; acc2Count++; }
    if (s.acc1 !== undefined) { acc1Sum += s.acc1; acc1Count++; }
  });

  const avgAcc3 = acc3Count > 0 ? acc3Sum / acc3Count : 0;
  const avgAcc2 = acc2Count > 0 ? acc2Sum / acc2Count : 0;
  const avgAcc1 = acc1Count > 0 ? acc1Sum / acc1Count : 0;

  if (avgAcc3 >= 70) return 3;
  if (avgAcc2 >= 80 && acc2Count >= 3) return 3;
  if (avgAcc2 >= 75) return 2;
  if (avgAcc1 >= 85) return 2;
  return 1;
}

function finishAudioNBack({b1, b2, b3}) {
  let parts = [];
  if (b1) parts.push(`1-back H/M/FA ${b1.hits}/${b1.miss}/${b1.fa}`);
  if (b2) parts.push(`2-back ${b2.hits}/${b2.miss}/${b2.fa}`);
  if (b3) parts.push(`3-back ${b3.hits}/${b3.miss}/${b3.fa}`);
  const scoreStr = parts.join(' · ');
  const acc1 = b1 ? accPct(b1.hits, b1.miss, b1.fa) : undefined;
  const acc2 = b2 ? accPct(b2.hits, b2.miss, b2.fa) : undefined;
  const acc3 = b3 ? accPct(b3.hits, b3.miss, b3.fa) : undefined;
  // Calculate average RT across all blocks
  const rtVals = [b1?.avgRt, b2?.avgRt, b3?.avgRt].filter(v => v !== null && v !== undefined);
  const avgRt = rtVals.length > 0 ? Math.round(rtVals.reduce((a,b)=>a+b,0) / rtVals.length) : null;
  const pb = isPersonalBest('audioNback', {acc1, acc2, acc3});
  const cmp = getPerformanceComparison('audioNback', {acc1, acc2, acc3});
  const bestAcc = Math.max(acc1 || 0, acc2 || 0, acc3 || 0);
  const isGood = bestAcc >= 70;
  const encourage = getEncouragement(isGood, pb);
  store.push('audioNback', {scoreStr, acc1, acc2, acc3, fa1: b1?.fa, fa2: b2?.fa, fa3: b3?.fa, avgRt, personalBest: pb});
  const rtStr = avgRt ? ` (${avgRt}ms avg)` : '';
  toast(`Audio N-Back · ${scoreStr}${rtStr}${pb ? ' 🏆 ' : cmp ? cmp + ' · ' : ' · '}${encourage}`, pb ? 'ok' : isGood ? 'info' : 'info');
}

async function audioNBackBlock(n, trials) {
  // Generate letter stream with some guaranteed matches
  const stream = [];
  for (let i = 0; i < trials; i++) {
    stream.push(audioNBackLetters[Math.floor(Math.random() * audioNBackLetters.length)]);
  }
  // Insert matches at pseudo-random intervals
  for (let i = n + 2; i < stream.length; i += Math.floor(4 + Math.random() * 5)) {
    stream[i] = stream[i - n];
  }

  return new Promise(async resolve => {
    screen.innerHTML = `
      <div class="stack">
        <h2>Audio N-Back (${n}-back)</h2>
        <div class="muted">Press <span class="kbd">Space</span> when you hear a letter that matches ${n} back.</div>
        <div class="muted" style="font-size:12px">Make sure your sound is on! 🔊</div>
        <div class="center" style="height:120px">
          <div id="audioVisual" style="font-size:80px; opacity:0.3">🔊</div>
        </div>
        <div style="text-align:center; margin:16px 0">
          <div class="muted">Trial: <b id="trialNum">0</b> / ${trials}</div>
        </div>
        <div class="row center">
          <div>Hits: <b id="hits">0</b></div>
          <div>Misses: <b id="miss">0</b></div>
          <div>False Alarms: <b id="fa">0</b></div>
        </div>
        <div class="muted" style="text-align:center; font-size:12px">Avg RT: <b id="rtDisplay">--</b>ms</div>
      </div>`;

    const audioVisual = $('#audioVisual');
    const trialNum = $('#trialNum');
    const rtDisplay = $('#rtDisplay');
    let i = 0, hits = 0, miss = 0, fa = 0;
    let canPress = true;
    let stimStart = 0;
    const rtData = [];

    function speakLetter(letter) {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel(); // Cancel any pending speech
        const utter = new SpeechSynthesisUtterance(letter);
        utter.rate = 0.9;
        utter.volume = 1.0;
        utter.pitch = 1.0;
        speechSynthesis.speak(utter);
      }
    }

    document.onkeydown = (e) => {
      if (e.code === 'Space' && canPress) {
        const rt = performance.now() - stimStart;
        const target = (i >= n) && (stream[i] === stream[i - n]);
        if (target) {
          hits++;
          rtData.push(rt);
          const avgRt = Math.round(rtData.reduce((a,b)=>a+b,0) / rtData.length);
          rtDisplay.textContent = avgRt;
        } else fa++;
        canPress = false;
        $('#hits').textContent = hits;
        $('#fa').textContent = fa;
        e.preventDefault();
      }
    };

    async function step() {
      if (i >= stream.length) { finish(); return; }

      trialNum.textContent = i + 1;
      speakLetter(stream[i]);
      stimStart = performance.now();
      audioVisual.style.opacity = '1';
      canPress = true;

      await wait(500);
      audioVisual.style.opacity = '0.3';

      await wait(1200);
      const target = (i >= n) && (stream[i] === stream[i - n]);
      if (target && canPress) {
        miss++;
        $('#miss').textContent = miss;
      }
      canPress = false;
      i++;
      await wait(300);
      step();
    }

    step();

    function finish() {
      document.onkeydown = null;
      speechSynthesis.cancel();
      const totalTargets = stream.filter((l, idx) => idx >= n && l === stream[idx - n]).length;
      const avgRt = rtData.length > 0 ? Math.round(rtData.reduce((a,b)=>a+b,0) / rtData.length) : null;
      resolve({hits, miss, fa, totalTargets, avgRt});
    }
  });
}

// Irregular block positions (not a grid) per standard Corsi test
const corsiPositions = [
  {x: 15, y: 20}, {x: 70, y: 8}, {x: 45, y: 45}, {x: 85, y: 35},
  {x: 25, y: 70}, {x: 55, y: 78}, {x: 10, y: 50}, {x: 75, y: 65}, {x: 40, y: 15}
];

async function runCorsi() {
  let level = 2, cleared = 0;
  const maxLevel = 7;

  while (level <= maxLevel) {
    const ok = await corsiLevel(level);
    if (ok) { cleared++; level++; }
    else break;
  }

  const span = level - 1;
  const pb = isPersonalBest('corsi', span);
  const isGood = span >= 5;
  const encourage = getEncouragement(isGood, pb);
  const scoreStr = 'Span ' + span;

  store.push('corsi', { scoreStr, span, trialsCorrect: cleared, trialsTotal: level - 2, personalBest: pb });
  toast('Corsi Blocks · ' + scoreStr + (pb ? ' 🏆 ' : ' · ') + encourage, pb ? 'ok' : isGood ? 'info' : 'info');
  drawLaunchpad();
}

async function corsiLevel(seqLen) {
  // Generate random sequence of block indices
  const seq = [];
  for (let i = 0; i < seqLen; i++) {
    let idx;
    do { idx = Math.floor(Math.random() * 9); } while (seq.length > 0 && seq[seq.length - 1] === idx);
    seq.push(idx);
  }

  return new Promise(async resolve => {
    // Build UI using DOM methods
    const container = document.createElement('div');
    container.className = 'stack';
    const h2 = document.createElement('h2');
    h2.textContent = 'Corsi Block-Tapping – Sequence of ' + seqLen;
    container.appendChild(h2);
    const instDiv = document.createElement('div');
    instDiv.className = 'muted';
    instDiv.id = 'corsi-inst';
    instDiv.textContent = 'Watch the sequence...';
    container.appendChild(instDiv);

    const field = document.createElement('div');
    field.className = 'corsi-field';
    field.style.cssText = 'position:relative;width:280px;height:280px;margin:20px auto;background:#0f1720;border-radius:12px';

    const blocks = [];
    for (let i = 0; i < 9; i++) {
      const block = document.createElement('div');
      block.className = 'corsi-block';
      block.dataset.idx = i;
      block.style.cssText = 'position:absolute;width:40px;height:40px;background:#1a2430;border-radius:8px;cursor:pointer;transition:background 0.15s,transform 0.15s;left:' + (corsiPositions[i].x * 2.4) + 'px;top:' + (corsiPositions[i].y * 2.4) + 'px';
      field.appendChild(block);
      blocks.push(block);
    }
    container.appendChild(field);

    const feedback = document.createElement('div');
    feedback.className = 'muted center';
    feedback.id = 'corsi-feedback';
    feedback.style.marginTop = '12px';
    container.appendChild(feedback);

    screen.textContent = '';
    screen.appendChild(container);

    // Show sequence
    await wait(500);
    for (let i = 0; i < seq.length; i++) {
      blocks[seq[i]].style.background = 'var(--brand)';
      blocks[seq[i]].style.transform = 'scale(1.1)';
      await wait(800);
      blocks[seq[i]].style.background = '#1a2430';
      blocks[seq[i]].style.transform = '';
      await wait(300);
    }

    // Recall phase
    instDiv.textContent = 'Tap the blocks in the same order';
    let recallIdx = 0;

    const handleClick = (e) => {
      const block = e.target;
      if (!block.classList.contains('corsi-block')) return;
      const idx = parseInt(block.dataset.idx, 10);

      if (idx === seq[recallIdx]) {
        block.style.background = 'var(--ok)';
        recallIdx++;
        if (recallIdx === seq.length) {
          cleanup();
          feedback.textContent = 'Correct!';
          feedback.style.color = 'var(--ok)';
          setTimeout(() => resolve(true), 800);
        }
      } else {
        block.style.background = 'var(--err)';
        cleanup();
        feedback.textContent = 'Wrong order';
        feedback.style.color = 'var(--err)';
        setTimeout(() => resolve(false), 800);
      }
    };

    field.addEventListener('click', handleClick);

    function cleanup() {
      field.removeEventListener('click', handleClick);
    }
  });
}

/* ---------- Operation Span Task ---------- */
const opSpanLetters = ['F', 'H', 'J', 'K', 'L', 'N', 'P', 'Q', 'R', 'S', 'T', 'Y'];

function generateOpSpanMath() {
  const a = Math.floor(Math.random() * 9) + 2;
  const b = Math.floor(Math.random() * 9) + 2;
  const op = Math.random() > 0.5 ? '+' : '-';
  const correct = op === '+' ? a + b : a - b;
  const isRight = Math.random() > 0.4;
  const shown = isRight ? correct : correct + (Math.random() > 0.5 ? Math.floor(Math.random() * 4) + 1 : -Math.floor(Math.random() * 4) - 1);
  return { eq: `${a} ${op} ${b} = ${shown}`, isCorrect: isRight };
}

async function runOpSpan() {
  const levels = [2, 3, 4, 5];
  let totalLettersCorrect = 0;
  let totalLetters = 0;
  let totalMathCorrect = 0;
  let totalMath = 0;
  let highestSpan = 0;

  for (const setSize of levels) {
    const result = await opSpanTrial(setSize);
    totalMathCorrect += result.mathCorrect;
    totalMath += result.mathTotal;
    totalLettersCorrect += result.lettersCorrect;
    totalLetters += result.lettersTotal;
    if (result.lettersCorrect === result.lettersTotal) highestSpan = setSize;
  }

  const letterAcc = Math.round((totalLettersCorrect / totalLetters) * 100);
  const mathAcc = Math.round((totalMathCorrect / totalMath) * 100);
  const pb = isPersonalBest('opSpan', letterAcc);
  const isGood = letterAcc >= 70 && mathAcc >= 80;
  const encourage = getEncouragement(isGood, pb);

  const scoreStr = `Letters: ${letterAcc}% • Math: ${mathAcc}%`;
  store.push('opSpan', { scoreStr, letterAcc, mathAcc, highestSpan, personalBest: pb });
  toast('Operation Span · ' + scoreStr + (pb ? ' 🏆 ' : ' · ') + encourage, pb ? 'ok' : isGood ? 'info' : 'warn');
  drawLaunchpad();
}

async function opSpanTrial(setSize) {
  const letters = [];
  const mathResults = [];
  const usedLetters = new Set();

  for (let i = 0; i < setSize; i++) {
    let letter;
    do { letter = opSpanLetters[Math.floor(Math.random() * opSpanLetters.length)]; } while (usedLetters.has(letter));
    usedLetters.add(letter);
    letters.push(letter);
  }

  return new Promise(async resolve => {
    for (let i = 0; i < setSize; i++) {
      const math = generateOpSpanMath();
      const mathResult = await showOpSpanMath(math, i + 1, setSize);
      mathResults.push(mathResult);
      await showOpSpanLetter(letters[i], i + 1, setSize);
    }

    const recallResult = await showOpSpanRecall(letters, setSize);

    resolve({
      mathCorrect: mathResults.filter(r => r).length,
      mathTotal: setSize,
      lettersCorrect: recallResult.correct,
      lettersTotal: setSize
    });
  });
}

async function runFilterPos(){

          const isPerfect = accFinal === 100;
          const prevScores = store.get()['filterPos'] || [];
          let perfectStreak = 0;
          if (isPerfect) {

            for (let i = prevScores.length - 1; i >= 0; i--) {
              if (prevScores[i].acc === 100) perfectStreak++;

            }
            perfectStreak++; // Add this session

          $('#done').innerHTML = `<span class="ok">Done:</span> ${correct}/${clicks} in <b>${secs}s</b>${pb ? ' 🏆' : ''}${streakText} · ${encourage}`;

    });

// Select tasks dynamically based on domain weaknesses
function selectSessionTasks(storeData, profile) {
  const domains = calculateDomainScores(storeData, profile);
  const sessionLength = profile?.preferences?.sessionLength || 'quick';

  // Rank domains by weakness (lowest score first)
  const ranked = Object.entries(domains)
    .sort((a, b) => a[1].current - b[1].current)
    .map(([domain]) => domain);

  // Map domains to recommended tasks
  const domainTasks = {
    attention: 'nback',
    verbal: 'span',
    spatial: 'spatial'
  };

  // Build task list based on session length
  const tasks = [];

  // Always start with warm-up
  tasks.push('filterPos');

  // Add tasks for weakest domains first
  if (sessionLength === 'quick') {
    // Quick: warm-up + 2 core tasks (weakest 2 domains)
    ranked.slice(0, 2).forEach(domain => {
      tasks.push(domainTasks[domain]);
    });
  } else {
    // Deep: warm-up + all 3 domain tasks + finisher
    ranked.forEach(domain => {
      tasks.push(domainTasks[domain]);
    });
    tasks.push('mult'); // Mental mult as finisher
  }

  // If attention is strong (≥75%), consider Dual N-Back instead
  if (domains.attention.current >= 75 && tasks.includes('nback')) {
    const idx = tasks.indexOf('nback');
    tasks[idx] = 'dualNback';
  }

  return tasks;
}

async function runCoachSession(){
  if (!coachOn()){ toast('Enable Coach Mode for adaptive flow'); return; }

  const storeData = store.get();
  const profile = profileStore.get();
  const tasks = selectSessionTasks(storeData, profile);

  toast(`Coach Session: ${tasks.length} tasks`);

  for (const task of tasks) {
    switch (task) {
      case 'filterPos':
        await runFilterPos();
        break;

      case 'nback':
        // Adaptive N-Back with auto-promotion
        const nbackHistory = storeData.nback || [];
        const startN = decideNFromHistory(nbackHistory);
        const block1 = await blockN(startN, startN===1?50:60);
        const acc1 = accPct(block1.hits,block1.miss,block1.fa);

        if (startN===1 && acc1>=85 && block1.fa<=2){
          toast('Promoting to 2-back!', 'ok');
          const block2 = await blockN(2,60);
          finishNBack({b1:block1,b2:block2});
        } else {
          finishNBack(startN===1?{b1:block1}:{b2:block1});
        }
        break;

      case 'dualNback':
        await runDualNBack();
        break;

      case 'span':
        await runSpan();
        break;

      case 'spatial':
        await runSpatial();
        break;

      case 'mult':
        await runMult();
        break;
    }
  }

  toast('Coach Session complete!', 'ok');
  drawLaunchpad();
}
